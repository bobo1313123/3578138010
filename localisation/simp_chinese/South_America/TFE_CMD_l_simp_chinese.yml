    CMD_black_gold_dream:0 "黑金之梦"
    CMD_black_gold_dream_desc:0 "根据多家权威机构的认证，查科地下埋藏着比肩委内瑞拉和巴塔哥尼亚的石油储藏。随着秘鲁玻利维亚邦联战胜巴拉圭后授权多家石油公司进驻开采，股票一夜之间疯长，而钻探也在稳步推进当中。\n不过繁荣背后，随着英国大萧条的到来，皇家壳牌石油公司和联盟标准石油公司的争权夺利甚至于械斗冲突、布什政府的限制法案，以及耗资巨大却一无所获的石油钻探，黑金的美梦前途未卜。"
    CMD_banditry_rampant:0 "匪帮肆虐"
    CMD_banditry_rampant_desc:0 "由于巴拉圭的非人镇压策略，以及残存抵抗部队的无孔不入，查科地区的匪帮已经到达了骇人的地步——1934年至少发生了8起骇人听闻的匪帮抢劫杀人，致使火车停运，一度让石油公司停止了钻探工作。\n不过好在布什政府扣扣搜搜地组织了少量宪兵和正规军前来镇压，虽然仍然有缺陷，但好过之前警察的杯水车薪。"
