    CMD_Hans_Koont:0 "汉斯·孔特"
    CMD_Hans_Koont_desc:0 "汉斯孔特也许是上一个时代德国最好的代表，当然上一个时代德国的战术和战略早已被扔进了垃圾堆。汉斯不像他的战友们一样在大战中呼风唤雨，他在1909年就作为顾问中的一员来到了邦联。随着大战德国的战败，孔特选择留在邦联，作为总参谋长统领秘鲁玻利维亚军队。\n查科战争的初期失利让孔特接任了总指挥，但他保守的作风饱受争议，博克龙一战的大量损失也将他数十年来在秘鲁玻利维亚的名声一夜跌落谷底，布什和托罗成为了秘鲁玻利维亚的英雄，他却无人问津。随后孔特被免职派遣往查科作为当地最高驻军将领执政，他作为一个被玻利维亚抛弃的将领，来到这片玻利维亚新征服的土地上管理，想想也是一种讽刺吧……"
