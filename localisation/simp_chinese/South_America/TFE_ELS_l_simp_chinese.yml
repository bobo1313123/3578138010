 #人物
 ELS_leon_cortes_castro:"莱昂·科尔特斯·卡斯特罗"
 ELS_leon_cortes_castro_desc:"在考迪罗、民族主义与革命战火席卷的中美洲，他是夹缝里残存的宪政理想。卡斯特罗不相信枪炮能铸就长久的统一，寄希望于道路、学堂与法律，来缝合联邦破碎的土地。\n他厌恶马丁内斯的屠杀农民，警惕乌维科的强权野心，也惧怕桑地诺掀起的底层风暴。他愿以谈判维系邦与邦之间的联结，以基建唤醒这片土地沉寂的生机。\n可是如果美国的动荡如同狂风呼啸而至，联邦共和国的周遭尽是挥舞刀枪的强人。这份温和的理想脆弱如薄纸，在暴力横行的时代，他守护的民主，随时会被战火碾碎。"
 ELS_teodoro_picado_michalski:"特奥多罗·卡多·米查尔斯基"
 ELS_teodoro_picado_michalski_desc:"哥斯达黎加法学家、教育家，是现任总统卡斯特罗的核心政治盟友，精通宪法，擅长调解各州矛盾，捍卫文官宪政，反对军人干政。"
 ELS_Rafael_Angel_Calderon_Guardia:"拉斐尔·安赫尔·卡尔德隆·瓜迪亚"
 ELS_Rafael_Angel_Calderon_Guardia_desc:"来自哥斯达黎加的医生、同时也是中美洲联邦共和国的国会议员，青年政坛骨干，支持文官政府，只维持小型自卫队，重视公共卫生与民生。"
 ELS_Jose_Maria_Moncada:"何塞·马里亚·蒙卡达"
 ELS_Jose_Maria_Moncada_desc:"老牌古典自由派。主张联邦基建、温和约束联合果品，支持自由贸易，反对极端独裁与底层暴力革命。同时也是在野党中美洲自由党的领导人。"

