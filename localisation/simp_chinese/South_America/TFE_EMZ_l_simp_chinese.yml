 EMZ_eloy_gaspar_ureta: "埃洛伊·加斯帕尔·乌雷塔"
 EMZ_eloy_gaspar_ureta_desc: "许多人都说埃洛伊·加斯帕尔·乌雷塔·蒙特埃尔莫索是一个没啥特色的人，诚然如此，埃洛伊仍然为自己取得了北方这一片“沃土”的统治权，作为秘鲁玻利维亚邦联的北方不训边境。\n\n埃洛伊早年出生于北秘鲁，并考取了乔斯略斯战争学院，并在大战后前往法国和联盟国研习军事。在1931年的秘哥战争中，埃洛伊临危受命指挥部队深入伊基托斯，虽然在此期间部队因为非战斗减员、游击队、哥伦比亚的水面炮艇几乎覆灭，但他们终于到达了伊基托斯，并为北秘鲁在战争中取得了先手。\n\n战后，埃洛伊被任命为赤道区域的领袖统管该地，尽管该地区贫瘠且充满危险，但在炮火之后，埃洛伊满怀希望的准备建立一个崭新的地区。"
 EMZ_northern_king: "北方王"

 EMZ_gold_in_the_trees: "树中的黄金"
 EMZ_gold_in_the_trees_desc: "\n\n\n\n£GFX_EMZ_gold_in_the_trees_picture\n\n\n\n\n\n自从阿克里战争以我国莫名其妙的失败而告终之后，秘鲁玻利维橡胶主产区便来到了我们这片土地。来自中国的劳工、来自山区讨生活的贫农、还有囚犯们被派往了这里，他们建立了一个又一个的橡胶种植园，为秘鲁玻利维亚生产这一宝贵的财产，这也使得我们人口大量涌入，伊基托斯已经自从建立起人口翻了数倍不止。§Y\n\n亚马逊邮轮公司！\n卡西俄-巴拿马-加拉加斯-贝伦-玛瑙斯-伊基托斯\n头等舱仅需200金索尔！包括28天全部房间、餐饮、导览费用。\n即刻垂询秘鲁轮船公司驻利马办事处，索取印有亚马逊兰花图样的彩印宣传册！§!"
 EMZ_patrolling_gunboats: "游弋炮艇"
 EMZ_patrolling_gunboats_desc: "经过软磨硬泡，我们勉强从巴西和阿根廷手上订购了大量内河炮艇。通过部署于雨林之中，我们可以有效的运输部队至我们之前望尘莫及的地域，也可以对游击队、侵略者予以打击。虽然价格不菲，但是这一笔买卖也是值得的。"
