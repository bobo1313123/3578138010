    COL_Jorge_Elisel_Gaitan:0 "豪尔赫·埃利塞尔·盖坦"
    COL_Jorge_Elisel_Gaitan_desc:0 "骗子、恶霸、赤色匪徒，这些都是关于盖坦的评价，在另一方面，他也有穷人之父、工人之子、道德和民主的卫道士等称号，他被誉为地狱的恶魔，又被称为“我们这个时代最伟大的人”和政府中的自由派们一样，盖坦生于20世纪的最初几年的波哥大，随后便考入了大学，并前往罗马等地深造。回国后，他踏入政坛，并在1929年的种植园大罢工中第一次接触到了人群，他也第一次亲眼见到了种植园农场主的残暴不仁，寡头资本的黑暗。他退出自由党，创建了左翼联盟，吸引了一大批左翼人士。\n1930年代对于哥伦比亚来说是一个疯狂的年代，先是和秘鲁玻利维亚的边境冲突几乎葬送了自由党的声誉，几乎使边境后退了百里；接着是保守党的改组，自由党的地位已经岌岌可危。阿尔弗雷多·巴斯克斯领导的军官联盟哗变导致的进军波哥大是压死骆驼的最后一根稻草，政府仓皇而逃，而在左翼联盟领导的工会却异军突起，用大罢工压下了军官的怒火，随着忠诚派的回归，联邦共和国保住了。\n盖坦也因此获得了无与伦比的威望，并在1934年众望所归当上了总统，1935年，他已经当了一年的总统，所有人都在憧憬一个崭新的共和国……"
    COL_National_Assembly:0 "大哥伦比亚国民议会"
    COL_Plinio_Mendoza_Nera:0 "普利尼奥·门多萨·内拉"
    COL_Plinio_Mendoza_Nera_desc:0 "出生于哥伦比亚最伟大学者家族普利尼奥的孩子，普利尼奥·门多萨·内拉是委内瑞拉和哥伦比亚两地的乡民，他也是§R盖坦§!最青睐的副手。\n在委内瑞拉的工作结束之后，他回到了§H波哥大§!，并参加了左翼革命，他最后被任命为教育部长，他发誓自己将为革命献出最后一滴血。"
    COL_Louis_A_Rozzo:0 "路易斯·A·罗佐"
    COL_Gilberto_Vieira_White:0 "吉尔伯托·维埃拉·怀特"
    COL_Romulo_Ernesto_Betancort_Bello:0 "罗慕洛·埃内斯托·贝坦科尔特·贝略"

    COL_Colombian_Civil_War:0 "哥伦比亚内战"


    COL_The_legacy_and_aotgm:0 "盖坦运动的遗产和遗波" 
    COL_The_legacy_and_aotgm_desc:0 "\n\n\n\n£GFX_idea_COL_The_legacy_and_aotgm_Pictures\n\n\n\n\n\n1933年，当军官因为不满哥伦比亚自由党的关于军费的变革，冲入波哥大准备使用武力颠覆国家秩序之时，盖坦领导的左翼运动拯救了共和国，工人和佃农发起了大罢工，切断了军政府的命门，随后全国左翼联盟和自由党一起回到了波哥大，扑灭了这一团烈焰。这件事让全国左翼联盟获得了无与伦比的威望，尽管它随后便回到了自由党之中。1934年，普马雷霍和盖坦的党内选举竞争以盖坦完胜而告终，并赢得了总统大选，盖坦运动胜利了，波哥大人民和全大哥伦比亚的人民都很高兴，但是来自遍布哥伦比亚的大农场主和庄园主显然对此极其不高兴。\n好吧，不可否认的是，左翼运动让我们留下了一大堆烂摊子，以及暴怒的地主阶级，如何平复他们的心情，或者碾碎他们，都是下一步需要考量的问题。"
    COL_divided_house:0 "分裂之家"
    COL_divided_house_desc:0 "\n\n\n\n£GFX_idea_COL_divided_house_Pictures\n\n\n\n\n\n§R你知道世界上三个最蠢的人是谁吗？耶稣基督、堂吉诃德、和我§!\n大哥伦比亚的粘合剂已经开始脱落，数十代总统的心血恐付诸东流，我们一手早就的联邦共和国的伟大基业似乎正在慢慢被凿空，来自各地的庄园、地主、农场主正在腐蚀我们这个共和国的基础，他们指着分裂，却说那是自由，他们指着暴乱，却说那是伟大。\n巴拿马的游击队、委内瑞拉的小威尼斯人、厄瓜多尔的煽动者，哪一个不是残忍卑劣狡诈之徒，哪一个不是可以和恶魔比肩的乱党，是时候剿灭他们了。"
    COL_divided_house_2:0 "分裂之家"
    COL_divided_house_2_desc:0 "\n\n\n\n£GFX_idea_COL_divided_house_Pictures\n\n\n\n\n\n§R你知道世界上三个最蠢的人是谁吗？耶稣基督、堂吉诃德、和我§!\n大哥伦比亚的粘合剂已经开始脱落，数十代总统的心血恐付诸东流，我们一手早就的联邦共和国的伟大基业似乎正在慢慢被凿空，来自各地的庄园、地主、农场主正在腐蚀我们这个共和国的基础，他们指着分裂，却说那是自由，他们指着暴乱，却说那是伟大。\n巴拿马的游击队、委内瑞拉的小威尼斯人、厄瓜多尔的煽动者，哪一个不是残忍卑劣狡诈之徒，哪一个不是可以和恶魔比肩的乱党，是时候剿灭他们了。"
    COL_Fulfilling_Bolivars_last_wish:0 "完成玻利瓦尔的遗愿"
    COL_Fulfilling_Bolivars_last_wish_desc:0 "\n\n\n\n£GFX_idea_COL_Fulfilling_Bolivars_last_wish_Pictures\n\n\n\n\n\n在百年之前，国父玻利瓦尔战略转移出加拉加斯，但是西班牙殖民者最终加固了这处老巢，我们再也没有回到这片我们朝思梦想的土地，我们也几乎失去了加勒比的出海口。\n但是，今时不同往日，大哥伦比亚正在用一种全新的面貌走来，这一次，我们来算总账了！把西班牙殖民者自己的头颅高高挂在那玻利瓦尔的坟墓上谢罪！大哥伦比亚万岁！"
    COL_Cooperation_between_baa:0 "哥阿合作"
    COL_Cooperation_between_baa_desc:0 "\n\n\n\n£GFX_idea_COL_Cooperation_between_baa_Pictures\n\n\n\n\n\n§C瓜亚基尔国际为两国提供了科技合作§!\n自拉普拉塔的平原至波哥大的山脉，自玻利瓦尔城的涓涓细流到大西洋的磅礴海浪，我国本和阿根廷一衣带水，确情深似海。\n天各一方的朋友的确如此，而我们确实也志同道合，共同抵御着那西班牙匪徒重新夺走拉美独立的白日梦。"
    COL_Do_not_train_the_border:0 "不训边境"
    COL_Do_not_train_the_border_desc:0 "\n\n\n\n£GFX_idea_COL_Do_not_train_the_border_Pictures\n\n\n\n\n\n大哥伦比亚的边境一直以来便等同于虚线——因为在别的国家眼里，我们的国境可以随意侵犯，这简直是奇耻大辱！因此，在盖坦总统上台后，利用普及教育的机会对我国地图进行了重新绘制，拿回本就属于我们的领土，这却令这些独裁专制国家极其不满，他们狡辩说我们对他们的领土起贪念，我们对此大为鄙夷，不过暂时这些事情也不能发作，因为国内的烂摊子还没处理完呢…"
    COL_Do_not_train_the_border_tt:0 "[BRA.GetFlag]§Y[BRA.GetName]§!对我国的评价: §R-50§!\n[BOL.GetFlag]§Y[BOL.GetName]§!对我国的评价: §R-50§!\n[GYA.GetFlag]§Y[GYA.GetName]§!对我国的评价: §R-50§!\n"


    colombia.1.t:0 "盖坦的演讲"
    colombia_news.1.t:0 "盖坦遇刺身亡"
    colombia_news.1.d:0 "全世界的目光都集中在大哥伦比亚:盖坦死了。\n在波哥大对支持者和民众发表新年演讲时，一名刺客混入了人群，他掏出了手枪，对着盖坦连开三枪，盖坦随即便倒地不起，尽管医生尽力抢救，但在1月1日的清晨，他还是去世了。也许是因为政敌报复，也许是右翼恐怖分子的作祟，甚至也有大量的人将矛头对准联盟国和西班牙，但是无论如何想，盖坦已经去世，而临时接管政府的大哥伦比亚联邦共和国国民议会正在尽力控制已经失控的局势。"
    colombia_news.1.a:0 "真野蛮"
    colombia_news.2.t:0 "大哥伦比亚内战"
    colombia_news.2.d:0 "盖坦去世之后，大哥伦比亚的矛盾彻底被引爆，无数群众动用私刑处决庄园主，工会再一次发起了大罢工，同时，政府军纷纷倒向自己忠诚的势力，社会主义党正在组建民兵，保守党的议员已经集体离开了席位——局势已经被引爆了。与此同时，玻利瓦尔的理想已经摔得粉碎，分离主义势力齐上阵，撕扯着共和国的皮肉，共和国已经彻底迈进了坟墓。小威尼斯方面暂时未发表任何评论"
    colombia_news.2.a:0 "不知道阿根廷做何感想"

    COL_All_eyes_on_Jorge:0 "万众瞩目豪尔赫"
    COL_Building_ttob:0 "修建巴别塔"
    COL_Negotiations_wtlu:0 "和工会的洽谈"
    COL_Looking_back_otp:0 "回顾往昔"
    COL_Establish_a_npb:0 "新建党支部"
    COL_Establish_a_npb_desc:0 "左翼联盟统筹全国的劣势便在于在早期我们过于注重核心组织的架构而忽视了基层的组织 而今我们也要将此提上日程，支部将在各大城市建立，以防空中楼阁的悲剧"
    COL_Contact_the_pic:0 "联系负责人"
    COL_Consolidating_lwaa:0 "合并左翼联盟事务"
    COL_Consolidating_lwaa_desc:0 "左翼联盟的事物处理过于繁杂，其弊端在于其作为联盟而非党派，以及其中党同伐异的派系，他们能共同进攻法西斯和地主反动势力，却无法根除自身的内斗。我们对此的解决方案要提上日程，首先便是整合事物，防止争端，并进一步削弱内斗的风险"
    COL_Connect_to_Pumarejo:0 "接通普马雷霍"
    COL_Transforming_tlp:0 "改造自由党"
    COL_Transforming_tlp_desc:0 "自由党本是资产阶级的代言人，然今日他的恶名将得到清洗，新的自由党将由盖坦操刀使其涅槃，更好的为新共和国服务"
    COL_A_fully_ripe_pomegranate:0 "熟透的石榴"
    COL_A_fully_ripe_pomegranate_desc:0 "盖坦主义之精髓为何，一能鼓动民众的信心，二来摧毁千年的封建，而人民民众的支持为何为第一？，他们的力量远比其他人强大，民众永远是国家的先锋，而我们若能加以利用，红石榴便能轻易的落下和捡起"
    COL_The_newly_built_Colombia:0 "新建的哥伦比亚"
    COL_The_newly_built_Colombia_desc:0 "以往的经验使我们明白，旧制度的遗毒会因为旧制度的存续而重新蔓延开来，同时在这内有叛徒外有强敌的情况下，旧制度的存续必然不是明智之举，如果要有真正的新社会主义哥伦比亚，便要从头开始建设哥伦比亚的制度，而这一阶段必然漫长，在开始之时便要有非常之措施"
    COL_Condemn_the_coup:0 "谴责政变"
    COL_Condemn_the_coup_desc:0 "长期国内的思想认定政变乃是军方拯救共和国的唯一道路，然而其最终结果大多为僭主的轮替更换，军方的安分守己往往能更好解决共和国的矛盾。虽然他们根本的原因总是因为政策的不公，但若先将这一思想深刻进入军方的思想，那么“治标不治本”实际上完全可以暂时克制这一行为，为我们改革创下良好空间"
    COL_Reflecting_on_ttdw:0 "反思千日战争"
    COL_Reflecting_on_ttdw_desc:0 "自由党和保守党已逾90年载，然而他们的和平确永远不存在，千日战争最终几乎摧毁了大哥伦比亚共和国，独裁者们一个接一个的执政，我们如果放任政治斗争，暂时将所有人指向同一个目标，这样我们的马车才不会因为过于快速而翻车，反对党们也不会因为我们的政策而掣肘我们"
    COL_Taking_democracy_atgp:0 "以民主为纲领"
    COL_Taking_democracy_atgp_desc:0 "民主主义是自大革命后世界所认可的道路，也是马克思主义所应该坚持的道路，盖坦主义不能只看到眼前的危机便彻底放弃民主的路线，实际上是极不明智的。我们所走的路线，亦要把社会民主主义中的优势加以补充完善"
    COL_Reopening_the_Vazquez_case:0 "重启巴斯克斯案"
    COL_Reopening_the_Vazquez_case_desc:0 "如今我们与保守党虽有极大争议，但西班牙的达摩克里斯之剑高悬头顶，必要时我们必须有极大的勇气摒弃过去的矛盾，这可以先从政变未遂的巴斯克斯将军的审判问题开始，尤其是军队中的保守派们"
    COL_A_united_nation:0 "团结的国家"
    COL_A_united_nation_desc:0 "试问自大哥伦比亚建立以来，除了玻利瓦尔的时代，何时会有如此之团结时代，同室操戈的悲剧终于告一段落，而共同面对和准备着解放小威尼斯，这是大哥伦比亚史无前例的创举，而团结将成为我们永恒的主题"
    COL_The_Dawn_of_gc:0 "大哥伦比亚之黎明"
    COL_The_Shining_Morning_Star:0 "闪耀的启明星"