 #人物
 BLZ_antonio_soberanis_gomez:"安东尼奥·索贝拉尼斯·戈麦斯"
 BLZ_antonio_soberanis_gomez_desc:"安东尼奥·索贝拉尼斯·戈麦斯究竟是英雄还是懦夫？当英国因为内战而无法顾及伯利兹时，当地的总督为了抵御中美洲联邦的吞并，只能行那驱虎吞狼之计，邀请墨西哥的驻军让墨西哥保护这一小块掌上明珠，而在英国从内战中恢复后早已元气大伤，早已无暇顾及这一块殖民地，只能与墨西哥达成协议将伯利兹“买了个好价钱”，而戈麦斯在公共演说中凝聚起了伯利兹跨越族群的底层力量，最终获得了总督卸任后首次选举的胜利，但是伯利兹却没有真正实现独立，墨西哥替代了英国的位置，如果他是英雄，他应该带领伯利兹实现真正的独立，就像他的那句名言一样——“我宁愿做死去的英雄，也不做苟活的懦夫”\n但是谁又能做一个完美的理想主义者呢？\n“墨西哥城来电，墨西哥城来电…”"

 #特质
 BLZ_surviving_hero:"苟活的英雄"
 BLZ_labour_leader:"工人领袖"

 #民族精神
 BLZ_under_the_giants:"巨人脚下"
 BLZ_under_the_giants_desc:"毫无疑问的是，我们仅凭自己的努力是无法实现独立的，而我们的救世主就是我们抬头才能仰望的那位巨人——墨西哥。我们与他们的关系就显得至关重要，为了我们的安全，他们暂时接管了我们的军事和外交层面，让我们和墨西哥更加紧凑的站在一起，或是为了保护，又或是为了——奴役。"
 BLZ_the_great_debate:"大讨论"
 BLZ_the_great_debate_desc:"在戈麦斯当上总统过后，民间开始针对伯利兹的未来进行大讨论，我们究竟是一个独立的国家，还是应该并入中美洲联邦？现在来看这是一个幼稚的问题，在墨西哥的保护下中美洲暂时不会打我们的主意，除非有大事发生，这样的话那些曾经在地下偷偷活动的人就会站起身来，光明正大的站在我们的对面，而他们的背后，是另一个我们无法忽视的势力——中美洲联邦。"
 BLZ_the_curse_of_the_plantations:"种植园的诅咒"
 BLZ_the_curse_of_the_plantations_desc:"种植园是我们的核心产业，我们的大多数国民也在种植园中工作，然后死亡。就像我们的国家一样，在囚笼中诞生，攀爬，然后融入进这血色般的泥土里，这是诅咒，也是新生。"

