 CAN_trade_balance_policy:"贸易平衡政策"
 CAN_trade_balance_policy_desc:"我们必须同时和北方工业市场、南方邦联棉花原料市场开展贸易。一边是工业制成品，一边是农产品与棉花；拒绝任何一方都将重创本国经济，但两头周旋也让外交进退维谷。"
 CAN_continental_mediator:"大陆斡旋者"
 CAN_continental_mediator_desc:"自独立以来，自由党不希望完全依靠英国武力保护。主张以经贸外交代替军备竞赛，通过贸易绑定南北两个美国，以谈判化解边境冲突，反对过度扩军。"
