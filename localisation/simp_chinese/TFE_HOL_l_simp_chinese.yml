HOL_KINGDOM_ADJ: "荷兰"
HOL_louis_beel: "路易·贝尔"

TFE_HOL_NEWS.1.t: "荷兰爆发贪污丑闻"
TFE_HOL_NEWS.1.desc: "阿姆斯特丹的报纸在头版同时登出了一份银行账目。账目显示，首相科莱恩名下的账户在过去三年里收到了来自瓦隆地区的大笔款项，而汇款方正是那些在边境煽动分裂的团体。\n\n科莱恩在议会辩称这是“政治献金”，但没有人愿意相信。他们的招牌上写着反对民族主义，如今却与分裂分子坐在同一张桌子上。\n\n威廉明娜女王在尼德兰晚间电台中宣读了一份简短的声明：内阁已失去议会信任，即日起解散。她没有点名科莱恩，但所有人都听懂了那句“我们的团结不能被任何人的私欲绑架”。新首相路易·贝尔带着女王的期许上台。\n\n海牙的街头没有欢呼，只有一种疲惫的沉默。"
TFE_HOL_NEWS.1.a: "他在耻辱中下台。"
TFE_HOL_NEWS.2.t: "尼德兰内战打响！"
TFE_HOL_NEWS.2.desc: "海牙地区的刺杀事件已经消磨了政府的最后一点耐心。政府忍下了瓦隆和卢森堡的所谓独立宣言，也忍下了佛兰德军事委员会的枪声，还忍下了鹿特丹船坞厂的汽笛，但现在政府已经没有耐心了。\n\n幸存的首相路易·贝尔在海牙发布正式声明：一切军事行动都是为了维护尼德兰联合王国的和平与稳定。同一天，阿姆斯特丹、布鲁塞尔和列日各自宣布自己才是整个低地的合法政府。\n\n他们说尼德兰内战已经爆发了。"
TFE_HOL_NEWS.2.a: "多米诺骨牌的倒下……"
TFE_HOL_NEWS.3.t: "卢森堡并入德国"
TFE_HOL_NEWS.3.desc: "有人说这是出于对炮火的恐惧，有人说这是德国的暗中操纵。\n\n我们无法得知哪个是对的，只能知道公投结果显示，78.2% 的卢森堡人支持并入德国。柏林发表声明，欢迎“德意志同胞回到祖国的怀抱”。"
TFE_HOL_NEWS.3.a: "新的开始？"
TFE_HOL_NEWS.4.t: "法德入侵低地！"
TFE_HOL_NEWS.4.desc: "柏林宣称，为了保护中欧的和平与安全，德国将对低地人民共和国采取军事行动。法国军队同时也会开进瓦隆地区以镇压革命。\n\n根据不愿意透露姓名的消息人士说，一份两国参谋部的备忘录指出：法国支持德国在尼德兰的行动，交换是瓦隆。"
TFE_HOL_NEWS.4.a: "肮脏的交易……"
TFE_HOL_NEWS.5.t: "尼德兰王国建立"
TFE_HOL_NEWS.5.desc: "今天，法德共同发表了一份声明，宣布低地已经恢复秩序，尼德兰王国复国。\n\n威廉明娜女王回到海牙，在阳台上向人群挥手。柏林称荷兰拥有完整主权；海牙的每个人都知道这句话的重量。"
TFE_HOL_NEWS.5.a: "至少结束了……"


#HOL_TVE_EVENT.3.t: "路易·贝尔被任命为首相"
#HOL_TVE_EVENT.3.desc: "投票结果正式公布，低地社会基督教党的路易·贝尔获得多数。他在宪法前宣誓，随后走进首相办公室——桌上堆着三份文件：瓦隆的请愿、佛兰德的军报，以及鹿特丹港务局的罢工通知。"
#HOL_TVE_EVENT.3.a: "至少现在好起来了，不是吗？"

#HOL_TVE_EVENT.4.t: "瓦隆爆发独立运动"
#HOL_TVE_EVENT.4.desc: "莱昂·德格雷勒在列日的阳台上宣布瓦隆地区正式独立，成立瓦隆共和国。他把这份宣言称作“对海牙腐败的清算”，并号召瓦隆人拿起武器。\n\n贝尔首相在议会谴责这是叛乱，宣布将武力镇压分离主义运动。"
#HOL_TVE_EVENT.4.a: "现在事情可闹大了。"
#
#HOL_TVE_EVENT.5.t: "佛兰德军事委员会建立"
#HOL_TVE_EVENT.5.desc: "斯塔夫·德克莱克宣布成立佛兰德军事委员会，声称是为了防止瓦隆人越境。实际上，委员会接管了佛兰德的铁路、港口和兵营，海牙的命令已经出不了布鲁塞尔。"
#HOL_TVE_EVENT.5.a: "低地的状况还能更糟吗？"

#HOL_TVE_EVENT.6.t: "卢森堡独立"
#HOL_TVE_EVENT.6.desc: "卢森堡地方议会宣布脱离尼德兰联合王国。官方理由是“避免被比利时地区的战火波及”，但各国使团都看得出，这只是把话说得体面一点。"
#HOL_TVE_EVENT.6.a: "我的天哪……"

#HOL_TVE_EVENT.7.t: "鹿特丹工人起义"
#HOL_TVE_EVENT.7.desc: "鹿特丹船坞厂的汽笛在凌晨响起。六千名工人占领了码头、仓库和电台，工人委员会宣布鹿特丹“不再承认海牙的任何命令”。起义者中有人提到了一个名字：安东·潘涅库克。"
#HOL_TVE_EVENT.7.a: "一个幽灵在尼德兰的上空盘旋……"
