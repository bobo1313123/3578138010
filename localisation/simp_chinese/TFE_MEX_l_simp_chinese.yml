#############墨西哥人名###################################
MEX_afangsuo_leiyesi:"阿方索·雷耶斯"
MEX_afangsuo_leiyesi_desc:"他出生在1889年的蒙特雷，在十六岁时他的笔尖就开始书写晨曦。在那个混乱的年代，他和安东尼奥卡索，何塞巴斯孔塞洛斯等人作为第一批创立“雅典娜青年协会”的成员在争论和书写中畅想着墨西哥的未来。然而那一天在1910年悄然降临。在鲜血与枪声占领了墨西哥的领土时，他并未离去，而是作为见证者和重建者塑造了他的家园。此后的时光中他一直作为外交官在世界遍地奔走，直到1936年，他被定为下一个总统候选人。如此，在诗歌与散文的运河中，他开始了他的总统生涯，用他的思想来拯救这个“愚昧而又癫狂”的墨西哥，开展属于他的宁静而又深刻的“革命”"
MEX_aoketavo_pasi:"奥克塔维奥·帕斯" 
MEX_aoketavo_pasi_desc:0 "派别：§C雅典娜青年协会先锋派§!\n1914生于墨西哥城米克斯科阿克，出身知识分子家庭,祖父伊雷内奥·帕斯是自由派作家、记者，父亲是支持萨帕塔革命的律师\/记者，母亲为西班牙移民后裔、天主教徒。在墨西哥革命过后于14岁入墨西哥大学哲学文学系与法律系，1931年开始发表诗歌，1932 年与人创办文学杂志《栏杆》，紧接着在时任尤卡坦州州长卡德纳斯号召下加入政府并且在尤卡坦进行办学，途中办学成果显著并且自身收到了玛雅文化以及超现实主义影响，在得到晋升的同时在年轻群体之间成立了一个新的超现实主义小团体——“创造派”\n“§C我们在词语中寻找家园，却在沉默中抵达§!。”——《栏杆》" 
MEX_weisengte:"维森特·隆巴多·托莱达诺" 
MEX_weisengte_desc:0 "派别：§R雅典娜青年协会左派§!\n1894年7月16日生于普埃布拉州特西乌特兰，父亲为意大利移民后裔，母亲是塞法迪犹太裔。1909 年赴墨西哥城求学，先后就读国立寄宿学校、国立预科学校；1919年获国立大学法学博士，后获UNDM哲学博士，是墨西哥首位公开信奉马克思主义的国立大学毕业生。\n1921年起投身工会运动，在墨西哥民众大学任职，深入接触工人阶层；1932—1933年任国立预科学校校长，推动教育改革。1934年创办了墨西哥工人大学，并且在准备整合国内工会形成一个统一组织。\n“§R教育不是特权，而是人民不可剥夺的权利§!。”——于墨西哥工人大学开学典礼"
MEX_samiuaier_lamosi:"萨缪埃尔·拉莫斯"
MEX_samiuaier_lamosi_desc:0 "派别：§G雅典娜青年协会右派§!\n1897年出生于米却肯州锡塔夸罗，幼年在家由父亲启蒙，1909年入米却肯州立大学圣尼古拉斯学院。1919年弃医从文，进入墨西哥国立大学高等研究院专攻哲学，师从安东尼奥卡索，对墨西哥的人文以及国民性有深入研究。于1932年加入政府教育部从事公共教育工作，反对欧洲中心主义的同时大力重建墨西哥人文历史和尊严。\n“§G墨西哥人的自卑，源于对自身历史与文化的否定§!”——《墨西哥人的性格与文化》"
MEX_fulangxisike_muxika:"弗朗西斯科·穆希卡" 
MEX_fulangxisike_muxika_desc:0 "派别:§g军方§!\n1884年生于墨西哥米却肯州廷圭丁，父亲是教师，童年随家迁居多地，在不同学校完成小学。在青年时期成为记者，为自由派报纸撰稿，公开反对君主制在米却肯州萨莫拉创办反君主制小报，投身革命运动。在墨西哥革命期间战功赫赫，并且在后革命时期在土地在分配，保护劳工期间发挥了重大的作用，并且做为军方的代言人在政府中活动。\n“§g资本必须服务于人民，而非奴役人民；国家有责任平衡劳资，保护弱者。§!”——阐述革命经济理念时的讲演"
