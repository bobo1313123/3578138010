 EGY_The_Faruq_Dynasty_desc: ""
 EGY_Land_of_Confusion: "迷茫之国"
 EGY_Land_of_Confusion_desc: "英国崩溃后，埃及在一瞬间失去了缠绕在它身上长达一个世纪的锁链，苦苦企盼的自由竟以这种形式突然降临。但不论是对于国王还是对于华夫脱党，建设一个现代化国家的路径似乎都藏在迷雾之中，难以捉摸。对于长期作为他国附庸的埃及来说，探索一条属于自己的道路并不容易。"
 EGY_Halfway_modernization: "半途而废的现代化"
 EGY_Halfway_modernization_desc: "在大约一百年多前，埃及还没有被奴役的时候，在这片大地上曾进行过一次大胆的现代化尝试。现代化的制造工艺被引进、大工厂被建立、职业军队也组织起来了——但很快就被西方殖民者的入侵所打断。从此埃及完全沦为了他国的半殖民地。今天的华夫脱党试图完成未竟的现代化事业，然而凋敝的国民经济、根深蒂固的封建制度、势力庞大的旧势力和甚至来自于王室本身的反对——都使这一行动举步维艰。但华夫脱党就是在外部势力的围剿下建立的，在完成这一事业之前他们绝不会停止战斗。"
 EGY_Emerging_leftwing_movement: "萌发的左翼运动"
 EGY_Emerging_leftwing_movement_desc: "20和30年代的现代化运动并非完全没有效果，它为埃及创造了一支初具规模的产业工人群体。然而在严重的贫困和社会不平等的环境之中，他们很快倒向了社会主义一方。再加上伊拉克方面的推波助澜，以埃及社会党为代表的左翼运动正取得越来越大的影响力。"
 EGY_Great_Arab_Dream: "大阿拉伯之梦"
 EGY_Great_Arab_Dream_desc: "阿拉伯——一个伟大的民族，它的帝国曾经统御四海，领土从伊比利亚一直延伸至波斯。它曾是伟大的城市——巴琉西亚、耶路撒冷、麦加和麦地那的主人；它曾是世界的文化心脏，千万本书籍被收藏在智慧宫之中。\n\n尽管阿拉伯帝国已经破碎，第一次世界大战时期的阿拉伯大起义也最终不过昙花一现，但仍有人愿意为了大阿拉伯而奉献自身。埃及一直有一个梦想，一个团结整个阿拉伯世界，使之不再受外人欺辱的梦想。在现在，埃及人愈发感觉到实现这个梦想的时机已经不远了。"