 ELS_Leon_Cortes_Castro: "莱昂·科尔特斯·卡斯特罗"
 ELS_Leon_Cortes_Castro_desc: "§Y出生日期:1882年12月8日§!\n§L在考迪罗、民族主义与革命战火席卷的中美洲，他是夹缝里残存的宪政理想。卡斯特罗不相信枪炮能铸就长久的统一，寄希望于道路、学堂与法律，来缝合联邦破碎的土地。\n他厌恶马丁内斯的屠杀农民，警惕乌维科的强权野心，也惧怕桑地诺掀起的底层风暴。他愿以谈判维系邦与邦之间的联结，以基建唤醒这片土地沉寂的生机。\n可是如果美国的动荡如同狂风呼啸而至，联邦共和国的周遭尽是挥舞刀枪的强人。这份温和的理想脆弱如薄纸，在暴力横行的时代，他守护的民主，随时会被战火碾碎。§!"
 ELS_disarmament_advocate: "裁军之人"
 ELS_infrastructure_builder: "基础设施建造者"
 ELS_Teodoro_Picado_Michalski: "特奥多罗·卡多·米查尔斯基"
 ELS_Teodoro_Picado_Michalski_desc: "§Y出生日期:1900年1月10日§!\n§L哥斯达黎加法学家、教育家，是现任总统卡斯特罗的核心政治盟友，精通宪法，擅长调解各州矛盾，捍卫文官宪政，反对军人干政。§!"
 ELS_core_political_ally: "核心政治盟友"
 ELS_Rafael_Angel_Calderon_Guardia: "拉斐尔·安赫尔·卡尔德隆·瓜迪亚"
 ELS_Rafael_Angel_Calderon_Guardia_desc: "§Y出生日期:1900年3月10日§!\n§L来自哥斯达黎加的医生、同时也是中美洲联邦共和国的国会议员，青年政坛骨干，支持文官政府，只维持小型自卫队，重视公共卫生与民生。§!"
 ELS_doctors_and_young_political_talents: "医生及青年政坛骨干"
 ELS_Jose_Maria_Moncada: "何塞·马里亚·蒙卡达"
 ELS_Jose_Maria_Moncada_desc: "§Y出生日期:1870年12月8日§!\n§L老牌古典自由派。主张联邦基建、温和约束联合果品，支持自由贸易，反对极端独裁与底层暴力革命。同时也是在野党中美洲自由党的领导人。§!"
 ELS_veteran_classical_liberal: "老牌古典自由派"



 ELS_The_fragile_federal_covenant: "脆弱的联邦盟约"
 ELS_The_fragile_federal_covenant_desc: "百年前联邦解体的创伤仍深埋土地。五邦只是勉强维系在一起，各州精英各怀心思，分离主义暗流涌动。危地马拉的庄园主、萨尔瓦多军人、哥斯达黎加的文官互不信任，一纸盟约随时会被战火撕碎。"
 ELS_The_fragile_federal_covenant_tip: "\n§R不可以裁撤部队，不可以训练新的部队!§!"
 ELS_The_shackles_of_united_fruits: "联合果品的枷锁"
 ELS_The_shackles_of_united_fruits_desc: "联合果品公司如同盘踞在热带土地上的巨型章鱼。它手握大片香蕉、咖啡种植园，控制港口、铁路与外贸航线，收买各州政客，联邦的经济命脉大半攥在外资手中。任何触动其利益的改革，都会招来资本施压、外交干预，甚至煽动地方叛乱。这片土地名义上属于联邦，经济却早已被跨国资本绑架。"
 ELS_A_land_blocked_by_mountains: "被群山阻隔的国土"
 ELS_A_land_blocked_by_mountains_desc: "高耸的火山山脉与湿热雨林切割国土。跨邦道路稀少，调动军队与物资寸步难行，但险峻地形同样是抵御外来入侵者的天然屏障。"
 ELS_The_church_and_indigenous_peoples: "教会与原住民"
 ELS_The_church_and_indigenous_peoples_desc: "天主教会手握大量地产，原住民世代被庄园体系压榨。旧时代的伤痕从未抚平，土地诉求随时会点燃燎原的农民起义。桑地诺的游击队仍在丛林中战斗，时刻警醒着联邦的统治者。"
