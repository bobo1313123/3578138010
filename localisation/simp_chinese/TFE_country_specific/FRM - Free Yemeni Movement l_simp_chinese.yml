 FRM_Down_with_Imam: "打倒伊玛目！"
 FRM_Down_with_Imam_desc: "§S“盖哈坦人怎么了？他们的时刻尽是悲惨， 他们的话语里尽是痛苦？ 无知、疾病、深重的不义， 恐惧、饥荒——还有一个‘伊玛目’。”——穆罕默德·马哈茂德·祖拜里§!\n\n1934年的战败扯下了腐朽伊玛目政权的最后一块遮羞布，造成了全国的动乱。但我们早应该看出来它的真面目的，那样我们的伟大先驱穆塔阿老师就不必死了！我们早该看到那专制的政府、落后的经济以及仍然处于封建部落时代的社会——我们早应该看出来也门在伊玛目的统治下，也门得到的只有无尽的苦难。那就让斗争开始吧，让民意的火山从眠床上跃起，将那暴君吞没，去摧垮那一千年来的腐败、不义与暴政！"
 FRM_Support_from_Iraq: "伊拉克支持"
 FRM_Support_from_Iraq_desc: "努曼领导的斗争委员会年龄不过两年，还遭遇了重大挫折，因此失去了我们的领袖。但在其伊拉克盟友的倾力支持下，斗争委员会仍然积蓄了足够的力量，以掀起一场波及全国的大起义。现在，每周都有大量的志愿者、专业人员从巴格达千里迢迢来到荷台达，为革命贡献力量。"
 FRM_Tribal_socialism: "部落社会主义"
 FRM_Tribal_socialism_desc: "也门是一个封建经济占绝对优势的国家，因此纵使斗争委员会通过各种手段一再向也门人宣传来自伊拉克的社会主义思想，但就目前来看效果十分有限。落后的社会条件成为了各类落后与反动思想的温床。"