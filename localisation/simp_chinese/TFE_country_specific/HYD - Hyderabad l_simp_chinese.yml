 HYD_Splendid_Golconda: "璀璨戈尔康达"
 HYD_Splendid_Golconda_desc: "在公元前4世纪之前，戈尔康达就已经是一处大型钻石矿区，其全盛时期更是正值莫卧儿帝国鼎盛期。戈尔康达钻石在珠宝界常被称为如水般清澈透明，英国王室王冠上186克拉的“光明之山”便是来自于这片土地。\n\n20世纪初，各大矿场的主要开采作业停止，但英印政府仍持续使用现代设备和勘探技术在该地区进行勘探活动。利用人们对天然钻石的渴望，英印政府在国际贸易中占足了外汇。而这片矿区的主人奥斯曼·阿里·汗也借此一跃成为有史以来最富有的人之一。\n\n§c可如今，印度四分五裂。钻石尽管仍然可以售往世界各地，但来势汹汹全球的大萧条，使人们不再愿意为这块璀璨的石头付出昂贵的代价……§!\n\n\n\n\n£GFX_idea_Splendid_Golconda_desc\n\n\n\n§!"
 HYD_fortress_without_coast: "无海岸的堡垒"
 HYD_fortress_without_coast_desc: "要说英属印度崩溃对海德拉巴的哪方面打击最大？钻石贸易和国防安全绝对是首当其冲。\n\n说白了，尼扎姆的钻石变现全来源于那庞大的不列颠市场需要，而军费开支也可以由英国人承担大部分。印度各邦尽管实力都无法威胁到海德拉巴，但是钻石贸易的财路一朝中断让尼扎姆维持军队变得极为困难。祸不单行，面临四面都可能会有的威胁，尼扎姆却不得不大量扩军来维持国家安定。§Y目前唯一的好消息，便是马德拉斯军区的英国专员还愿意为尼扎姆分销部分钻石。尽管让他抽走不少，但至少让海德拉巴不至于立刻陷入贫困。§!\n\n§R可一旦马德拉斯发生政治变动，海德拉巴本不健康经济一定会遭到重创。§!\n\n\n\n\n£GFX_idea_fortress_without_coast_desc\n\n\n\n§!"