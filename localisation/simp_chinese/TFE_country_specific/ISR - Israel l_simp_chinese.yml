 ISR_Zion: "锡安"
 ISR_Zion_desc: "在经历了两千多年的流浪后，犹太人终于回到了自己的故乡，重建了他们日思夜想的犹太国。居住在这片土地上的犹太男男女女都发誓要誓死保卫这来之不易的家园。"
 ISR_International_Jewish_Support: "国际犹太人支持"
 ISR_International_Jewish_Support_desc: "国际犹太复国主义运动对犹太国鼎力支持，每月都有大量志愿者和投资涌入犹太国，为其发展提供了巨大的帮助。"
 ISR_Two_Axes_Jaffa_oriented: "两个轴心:§c倾向雅法§!"
 ISR_Kibbutz: "基布兹"
 ISR_Kibbutz_desc: "基布兹是犹太国境内广泛存在的一种自治公社，基布兹内实行公有制度，成员过着集体生活。约有超过一半的犹太国人生活在基布兹中。集体劳作促进了贫瘠土地的开发，但基布兹高度自治的属性也带来了行政管理和协调上的问题。"
 ISR_Paramilitary_organization: "准军事组织"
 ISR_Paramilitary_organization_desc: "一战前就在巴勒斯坦地区活跃的犹太准军事组织为犹太国的建立做出了不可磨灭的贡献，是他们在战争中抵御了土耳其人和阿拉伯人的入侵，赶跑了试图把巴勒斯坦变成殖民地的英国人。但现如今这些准军事组织正变得愈发激进，成为了对雅法高层来说最老大难的问题。"
 ISR_Diplomatic_situation_beseton_all_sides: "外交状况:§R四面受敌§!"
 