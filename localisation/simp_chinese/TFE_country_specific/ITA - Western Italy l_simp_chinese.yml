 ITA_Disorganized_militia: "混乱的民兵"
 ITA_Disorganized_militia_desc: "意大利红军建立伴随着民兵组织与正规军武装之间的分歧，民兵力量是联合阵线的早期骨干与街头分子，而正规军则是由前政府士官与大战左翼老兵组成的团体，内战以来，两派别分期不断，难以形成共识。党务工作焦点便在于如何统合这股混乱之力。"
 ITA_Peril_of_Committee_Democracy: "委员会民主的危难"
 ITA_Peril_of_Committee_Democracy_desc: "意识到法西斯威胁当头与分裂的预警，以意大利社会党和意大利共产党为首，开创了人民联合阵线，力在争取民主人士与工团人士。\n\n但这一委员会在历经内战种种摧残后，变得漏洞百出，左派何以能改变？"