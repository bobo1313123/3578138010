 ITA_Antonio_Gramsci: "安东尼奥·葛兰西"
 ITA_Antonio_Gramsci_desc: "§Y出生日期:1891年1月23日§!\n\n§L葛兰西出生于撒丁岛的职员家庭，其最终在大学毕业后加入了意大利社会党，作为党内才华横溢的思想家，他始终站在马克思雕像下捍卫暴力革命的路线。\n\n好景不长，墨索里尼在退党后成立了战斗法西斯同盟，前党员厚颜无耻地成为了党的敌人，葛兰西在社会党分裂后加入了新创立的意大利共产党，葛兰西预见了即将到来的灾难，转变了过去的先锋党态度，呼吁并伙同社会党人、共和党人、无政府主义者组成社会主义阵线，这一先见举措导致了法西斯进军的破产。\n\n当左翼以为法西斯分子被打败、民主议会被保留维持、社会主义即将获得胜利之时，墨索里尼成立了地方政权，意大利陷入了第二次分裂。社会主义阵线在葛兰西等政治家领导下成立了意大利社会主义共和国。中央为联合革命委员会。\n\n未雨绸缪，在战火之后的平和岁月里，社会主义勇士们要面对虎视眈眈的法西斯野兽与保守顽固的王国，而现在，葛兰西仍坚持他的共产理想，在都灵为革命事业奔波。§!"
