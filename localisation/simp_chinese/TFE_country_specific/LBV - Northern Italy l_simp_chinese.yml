 LBV_Benito_Mussolini: "贝尼托·墨索里尼"
 LBV_Benito_Mussolini_desc: "§Y出生日期:1883年7月29日§!\n\n§L社会党热情澎湃的记者、法西斯联盟的总领袖、意大利运动的新偶像——三种描述汇聚在一个人身上毫不冲突的人物便是贝尼托·墨索里尼，在一战阴霾之后饱受祖国衰败摧残的他，毅然另立新党，就这样，一个混杂退伍老兵、失业青年、革命工团主义者、保守主义者的阵线在达权的墨索里尼统领下，冲击着意大利的传统政治绘谱，并占据成一方思想之霸主。\n\n进军罗马的失败酿就墨索里尼政治生涯中最为惨痛的灾难，人力的流失与威望的丧失令他只能退缩阵线，而在战后危机情势下，则自立政府，宣告法西斯民族政府成立，惮赫称王；内战怛怛，疮痍遍地，祖国的分裂、兄弟阎于墙令他痛心，而在未见处，因进军失败而愈演愈烈的流言蜚语则不断折磨他的神智……\n\n最关键的一年，墨索里尼是驾驶摇摇欲坠的帆船，最终荣膺辉煌的冠冕，还是败于私欲友人的背叛，浪得一生激情，无论如何，唯有意志决定他的未来。§!"

