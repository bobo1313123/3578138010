 LBV_Paralyzed_Blackshirts: "瘫痪的黑衫军"
 LBV_Paralyzed_Blackshirts_desc: "在长达十几年的厮杀后，意大利内战陷入了沉默，黑衫军被改组为国家安全民队，以充当常备军。但预备兵源的素质和人力匮乏问题导致了军队指挥体系和基层的混乱，甚至于难以达到大战的军事水准，为应对如此境况，我们需要改革和整肃国防力量。\n\n\n\n\n£GFX_idea_Paralyzed_Blackshirts_desc\n\n\n\n§!"
 LBV_Committee_in_danger: "岌岌可危的委员会"
 LBV_Committee_in_danger_desc: "法西斯新政制度问题经过几十年的发展已经暴露出许多问题，干部对群众的疏远、组织体系的腐败、政策执行未落实都构成了国家法西斯党面临的糟糕处境，大法西斯委员会需要进行精简和调整以适应国家的发展。\n\n委员会的威望自内战以来逐渐降低，法西斯党内也出现了异见之声，在墨索里尼未听闻处，底下的窃窃私语正不断回荡。\n\n\n\n\n£GFX_idea_Committee_in_danger_desc\n\n\n\n§!"
 LBV_Summarizing_the_past: "总结过去"
 LBV_Summarizing_the_past_desc: "仓促地进军确实起到了出其不意的效果，可惜…我们太过于天真。\n\n领袖认为国王会为了挽救这个濒临倾覆的国家而与我们合作，却不想这把“又挫又盾的军刀”竟然会为了一己私利如此犹豫。上一次，因为对于形势的错判，我们没能成功控制全意大利。而这次，我们要坚决以戈止武，彻底结束意大利的乱局！"
 LBV_Protracted_civilwar_1: "内战旷久"
 LBV_Protracted_civilwar_1_desc: "无论是码头捕捞的渔民，还是城市居住的市民，亦或者田野劳作的农民，都对于战争感到了疲惫，人民的心声不再为战争所振奋，后者摧残了人们的心智和生活，经济一再衰退，社会的弹性减少，我们必须立刻结束混乱的战争状态，回归1861的统一。\n\n\n\n\n£GFX_idea_Protracted_civilwar_desc\n\n\n\n§!"
