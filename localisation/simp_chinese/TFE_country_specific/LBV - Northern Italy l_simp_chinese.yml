 LBV_Paralyzed_Blackshirts: "瘫痪的黑衫军"
 LBV_Paralyzed_Blackshirts_desc: "在长达十几年的厮杀后，意大利内战陷入了沉默，黑衫军被改组为国家安全民队，以充当常备军。但预备兵源的素质和人力匮乏问题导致了军队指挥体系和基层的混乱，甚至于难以达到大战的军事水准，为应对如此境况，我们需要改革和整肃国防力量。\n\n\n\n\n£GFX_idea_Paralyzed_Blackshirts_desc\n\n\n\n§!"
 LBV_Committee_in_danger: "岌岌可危的委员会"
 LBV_Committee_in_danger_desc: "法西斯新政制度问题经过几十年的发展已经暴露出许多问题，干部对群众的疏远、组织体系的腐败、政策执行未落实都构成了国家法西斯党面临的糟糕处境，大法西斯委员会需要进行精简和调整以适应国家的发展。\n\n委员会的威望自内战以来逐渐降低，法西斯党内也出现了异见之声，在墨索里尼未听闻处，底下的窃窃私语正不断回荡。\n\n\n\n\n£GFX_idea_Committee_in_danger_desc\n\n\n\n§!"
 LBV_Summarizing_the_past: "总结过去"
 LBV_Summarizing_the_past_desc: "仓促地进军确实起到了出其不意的效果，可惜…我们太过于天真。\n\n领袖认为国王会为了挽救这个濒临倾覆的国家而与我们合作，却不想这把“又挫又盾的军刀”竟然会为了一己私利如此犹豫。上一次，因为对于形势的错判，我们没能成功控制全意大利。而这次，我们要坚决以戈止武，彻底结束意大利的乱局！"
 LBV_Protracted_civilwar_1: "内战旷久"
 LBV_Protracted_civilwar_1_desc: "无论是码头捕捞的渔民，还是城市居住的市民，亦或者田野劳作的农民，都对于战争感到了疲惫，人民的心声不再为战争所振奋，后者摧残了人们的心智和生活，经济一再衰退，社会的弹性减少，我们必须立刻结束混乱的战争状态，回归1861的统一。\n\n\n\n\n£GFX_idea_Protracted_civilwar_desc\n\n\n\n§!"
 LBV_Committee_in_danger_1: "岌岌可危的委员会"
 LBV_Committee_in_danger_1_desc: "法西斯新政制度问题经过几十年的发展已经暴露出许多问题，干部对群众的疏远、组织体系的腐败、政策执行未落实都构成了国家法西斯党面临的糟糕处境，大法西斯委员会需要进行精简和调整以适应国家的发展。\n\n委员会的威望自内战以来逐渐降低，法西斯党内也出现了异见之声，在墨索里尼未听闻处，底下的窃窃私语正不断回荡。\n\n\n\n\n£GFX_idea_Committee_in_danger_desc\n\n\n\n§!"
 LBV_Paralyzed_Blackshirts_1: "瘫痪的黑衫军"
 LBV_Paralyzed_Blackshirts_1_desc: "在长达十几年的厮杀后，意大利内战陷入了沉默，黑衫军被改组为国家安全民队，以充当常备军。但预备兵源的素质和人力匮乏问题导致了军队指挥体系和基层的混乱，甚至于难以达到大战的军事水准，为应对如此境况，我们需要改革和整肃国防力量。\n\n\n\n\n£GFX_idea_Paralyzed_Blackshirts_desc\n\n\n\n§!"
 LBV_Cadre_Training: "干部培训"
 LBV_Cadre_Training_desc: "政权要运行，光靠领袖的威望和群众的狂热不够，得有一批能把政策落到街巷与田间的干部。眼下党内不少人是靠内战时的功绩或入党早晚熬上来的只会喊口号缺看不懂得管区里的账目、而我们开展的干部培训要让他们脱掉身上的兵痞气，学会照章办事。理解党纲，熟悉民政与军需的规矩。一支这样的干部队伍，才是米兰政权在内战和战后都能站得住的根基。"
 LBV_united_people: "国民一心"
 LBV_united_people_desc: "在伟大舵手墨索里尼的领导下，将码头工人、市民和佃农等拉拢到了一起。街上不再有人为一两句话争吵，工厂里缺人手时有人自愿顶班，后方省下来的每一份物资都优先送往前线。只要我们还能守住这个共识，赤匪和王党就别想轻易把北方再撕开。"
 LBV_Protracted_civilwar_2: "内战旷久"
 LBV_Protracted_civilwar_2_desc: "无论是码头捕捞的渔民，还是城市居住的市民，亦或者田野劳作的农民，都对于战争感到了疲惫，人民的心声不再为战争所振奋，后者摧残了人们的心智和生活，经济一再衰退，社会的弹性减少，我们必须立刻结束混乱的战争状态，回归1861的统一。\n\n\n\n\n£GFX_idea_Protracted_civilwar_desc\n\n\n\n§!"
 LBV_Protracted_civilwar_3: "内战旷久"
 LBV_Protracted_civilwar_3_desc: "无论是码头捕捞的渔民，还是城市居住的市民，亦或者田野劳作的农民，都对于战争感到了疲惫，人民的心声不再为战争所振奋，后者摧残了人们的心智和生活，经济一再衰退，社会的弹性减少，我们必须立刻结束混乱的战争状态，回归1861的统一。\n\n\n\n\n£GFX_idea_Protracted_civilwar_desc\n\n\n\n§!"
 LBV_Paralyzed_Blackshirts_2: "瘫痪的黑衫军"
 LBV_Paralyzed_Blackshirts_2_desc: "在长达十几年的厮杀后，意大利内战陷入了沉默，黑衫军被改组为国家安全民队，以充当常备军。但预备兵源的素质和人力匮乏问题导致了军队指挥体系和基层的混乱，甚至于难以达到大战的军事水准，为应对如此境况，我们需要改革和整肃国防力量。\n\n\n\n\n£GFX_idea_Paralyzed_Blackshirts_desc\n\n\n\n§!"
 LBV_Assault_Team: "行动突击队"
 LBV_Assault_Team_desc: "第一次世界大战以及意大利内战的前线教会了我们一件事：阵地战熬人，必须得有一支能撕开口子的队伍。行动突击队将从各师的精锐里抽调，配最好的武器和最多的训练，平时散在营队里当骨干，战时集中起来当尖刀。有了这支拳头，我们才有本钱在僵局里主动敲开敌人的防线，而不是永远等着挨打。"
 LBV_Paralyzed_Blackshirts_3: "瘫痪的黑衫军"
 LBV_Paralyzed_Blackshirts_3_desc: "在长达十几年的厮杀后，意大利内战陷入了沉默，黑衫军被改组为国家安全民队，以充当常备军。但预备兵源的素质和人力匮乏问题导致了军队指挥体系和基层的混乱，甚至于难以达到大战的军事水准，为应对如此境况，我们需要改革和整肃国防力量。\n\n\n\n\n£GFX_idea_Paralyzed_Blackshirts_desc\n\n\n\n§!"
 LBV_Slow_recovery: "缓慢恢复"
 LBV_Slow_recovery_desc: "打了十几年的内战，意大利不是一夜之间就能缓过来的。车床缺零件，仓库里的原料不足，铁路线被炸了又修，修了又炸，货运绕远路，物价也跟着涨。青壮年不是死了就是还在部队里，地里干活的多是老人和女人。现在只能慢慢恢复国家的生机。"
 LBV_Gradually_recovering_military: "逐渐恢复的军队"
 LBV_Gradually_recovering_military_desc: "内战打掉的是部队的老底子。精锐老兵多数战死在头几年，接替上来的新兵连队列都没站齐，军官要一边打仗一边教他们用枪。现在的局面好转了。新兵在休整里学会了基本的战术，军火库不再空空荡荡，从打坏的工厂里修出来的步枪和机枪重新发到营队。至少现在的意大利军队不再是一碰就散的乌合之众。照这个势头再磨一两年，我们手里才算真正有了一支强大可靠的意大利军队。"
 LBV_Help_From_Spain: "来自西班牙的援助"
 LBV_Help_From_Spain_desc: "内战打成如今这副模样，北方这边其实一直指不上多少外人，兵员和弹药一天比一天紧。我们的西班牙朋友这时候肯伸手，称得上是一份难得的情谊。他们把军械、贷款还有从北非战场和内战回来的老兵一批批送过了海。这笔援助解了我们的燃眉之急，让黑衫军有了喘息，也让意大利在欧陆多了一个并肩的同道。这份恩情，我们记下了。"
 
 LBV_collapse_war_decisions: "内战旷久"
 LBV_Purchasing_Lost_Rifle: "求购流失步枪"
 LBV_Purchasing_Lost_Rifle_desc: "我们的步枪生产能力远远比不上我们消耗的速度，但邻国政府并不愿意卖给我们枪支，所以只能将目标锁定在那些他国退役枪支与流失枪支上了。"
 LBV_Managing_black_market: "照顾军火黑市"
 LBV_Managing_black_market_desc: "可我们在寻常市场可找不到那些火炮类的重武器和新型步枪，要找那些那些真正能打仗的家伙，我们可不得不进行一些麻烦且昂贵的黑市交易。"
 LBV_Veteran_Swiss_Mercenary: "瑞士老牌佣兵"
 LBV_Veteran_Swiss_Mercenary_desc: "瑞士佣兵的名声自14世纪以来就传遍四海，从高卢到匈牙利大平原都曾有他们英勇作战的身影。尽管现在瑞士邦联的经济支柱已经不再是佣兵产业，但是一些总部在瑞士的佣兵公司依然是可以首先考虑的对象。"
 LBV_Veteran_Swiss_Mercenary_tt: "§Y创建一支经验丰富的佣兵队§!§R（内战结束后删除）§!"
 LBV_Infiltrate_enemy_organization: "渗透敌方组织"
 LBV_Seeking_foreign_aid: "寻求外国援助"
 LBV_Establish_military_factory: "建立军工厂"
 LBV_Destroy_enemy_supplies: "破坏敌方补给"
 LBV_Seize_enemy_supplies: "抢夺敌人物资"

 LBV_March_on_Rome_Lessons: "吸取进军罗马的教训"
 LBV_March_on_Rome_Lessons_desc: "圣墓宣言宣告了我党的纲领和目标，然而1922年我党运动却功败垂成，进军罗马的辉煌之路遭到了左翼反对派与颠覆分子的破坏，于米兰成立临时政府后，我党与其他政权陷入角斗战场。原以为战争很快会以黑衫军革命的胜利而告终，却不料持续了如此之长，我们必须得从过去的失败中汲取教训，并更好地奠基于以后的胜利。"
 LBV_Ready_for_Reunification: "为统一做准备"
 LBV_Ready_for_Reunification_desc: "无论是党干事还是一般群众都对于内战感到晦暗，他们对于政权的信心也在逐渐丧失。几年前，冲突已停止，在非正式休战停火期间我国得以利用剩下的工业基础与大大小小的农庄建立战时经济基础。并让大萧条带来的影响逐渐淡出常态，遵从“信仰、服从、战斗”的信条，我们将会在最终之战中，夺回我们的家园与祖国！"
 LBV_collapse_war_decisions_tt: "解锁决议：£decision_icon_small以§Y准备再次内战§!"
 LBV_Fascist_regime: "法西斯党政"
 LBV_Fascist_regime_desc: "大法西斯委员会作为商议政党重大路线和决策的议会，现情况下应进行政治结构的改革。首先，要革除内部并行的机关部门，同时精简体系，扩大地方的权能分配，对委员会设立监察与执行机关以更快地下达指令与处理要务。唯有如此，才能建设完备的法西斯领导的身体国家。"
 LBV_Lombard_Line: "伦巴底防线"
 LBV_Lombard_Line_desc: "修建堡垒，兴建工事，南方的意大利王国势力较我们而言更为强大，建造这些防御阵地有利于我们的战事。"
 LBV_Lombard_Line_tt: "§Y在边界上修筑防御堡垒，以准备即将发生的战斗§!"
 LBV_Professionalized_Cadres: "职业化干部"
 LBV_Professionalized_Cadres_desc: "现在，政党许多干部都是未经筛选的纯粹的暴力分子或者街头混混，要想建立完美的领导队伍，就需要重调筛选标准与干部的政治培养，除了对法西斯主义与纲领的熟记外，还要有充实的人文社科或其它领域的知识基础。我们要锻炼一支高尚而权威的党组织。"
 LBV_Integrate_local_militias: "整合地方民兵"
 LBV_Integrate_local_militias_desc: "在通讯不方便情况下，地方基层自立了民兵，同时一些不受中央调控的法西斯团体也在各行其是。委员会党中央需要建立总指挥部来管理这些作战力量——全国的旧式武器还有个人财产中的武器都需要用于军队——直到胜利。"
 LBV_three_militias: "§Y组建三支有经验的民兵部队§!"
 LBV_Launching_another_offensive: "再次进军"
 LBV_Launching_another_offensive_desc: "箭在弦上，时机已至，不再有迷茫与踯躅，行将万里，法西斯的战士们，再次延道进发——从米兰到罗马！"
 LBV_Launching_another_offensive_tt: "§R承《圣墓宣言》，承大法西斯，我们必将一统意大利！§!"
 LBV_Unite_all_classes: "团结各阶级"
 LBV_Unite_all_classes_desc: "不分职业高低贵贱，不分出身门第富贫，唯有心向法西斯主义，才是意大利子民。祖国在召唤，军民一心、上下同体、誓讨乱贼，底定戡乱。"
 LBV_Youth_Assault_Camp: "青年突击营"
 LBV_Youth_Assault_Camp_desc: "我们要将社会最具活力的群体进行动员，那便是青年，要让他们知道，民族和国家的生存即一切，神话是一种信仰，一种热情。其他政治势力都不具备统合意大利民族和完成文化复兴的能力，只有国家法西斯党——这个活力与力量的化身——才能赢得胜利。"
 LBV_Youth_Assault_Camp_tt: "§Y组建两支有经验的摩托部队§!"
 LBV_Revolutionary_Regeneration: "革命再生"
 LBV_Revolutionary_Regeneration_desc: "法西斯运动，一种意志，一种战斗，一种行动，它是真正的革命，祛除过往朽木般的制度与意志，塑造新的、生命力的国家，法西斯指归乃是如此——现在，我们要实行唯一的、真正的革命，为意大利复兴而战。"
 LBV_Armed_Security_Militia: "武装安全民队"
 LBV_Armed_Security_Militia_desc: "国家安全民队由黑衫军改组而来，在上一次政党转进中将法西斯联盟改组为政党-民兵的统合组织后，安全民队顺应而成为党防御红党与保皇派的攻击以及争夺阵地的武装组织，而在米兰宣言后，安全民队便作为国家常备军中的一支重要力量保卫着法西斯党。现在，我们要清点库存和组织小工坊，尽快地建设、推进安全民队的进步——这支法西斯意志的强大军队是我党的军事关键。"
 LBV_Forging_Ahead_Toward_Future: "拓进向未来"
 LBV_Forging_Ahead_Toward_Future_desc: "为未来而战，为国家重建而战，我们战争的正义性在于将意大利从左翼贼子与王室吸血蜱虫手中拯救出来，我们要以火与血来救赎意大利。"
 LBV_Spear_of_Duche: "杜切之矛"
 LBV_Spear_of_Duche_desc: "特种作战自一战以来便为我党所重视，加之借鉴德国的突击队战术，将步兵以战斗群整编成突击作战力量，还有进行特别行动的部队。阿蒂亚突击队——他们斗志昂扬、身经百战，让他们担任教官、士官与新建的突击队混编，将大幅提升我军战斗力，化为最尖锐的兵戈之矛，刺向敌人的心脏。"
 LBV_For_Nation_and_Country: "为了民族与国家…"
 LBV_For_Nation_and_Country_desc: "意大利不能再当令人宰割的鱼肉，她是孕育地中海文明的摇篮，是古老文明的传承。意大利必须再次崛起，从废墟与尸山中。"
 LBV_Italy_Rise: "意大利，崛起"
 LBV_Italy_Rise_desc: "长夜漫漫，道路险峻……但法西斯的未来一片灿烂。为了民族与国家，奋力向未来，唯有鲜血，铸造帝国。"

 tfe_norita_focus.1.t: "西班牙国的援助"
 tfe_norita_focus.1.d: "第一批西班牙的援助抵达米兰时，码头上堆着打捆的步枪、成箱的弹药，还有从伊比利亚战场轮换下来的老兵。西班牙没有忘记他们在亚平宁半岛北方的同道，马德里方面把军火和见过血的战士们送过了海。这批援助来得正是时候：防线的缺口有东西补了，新兵也有了能带他们的老兵。这份情谊，值得我们把他们当作真正的兄弟来感谢。"
 tfe_norita_focus.1.a: "感谢我们的棕色同袍"