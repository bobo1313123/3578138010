 LBV_Committee_in_danger_1_desc: "法西斯新政制度问题经过几十年的发展已经暴露出许多问题，干部对群众的疏远、组织体系的腐败、政策执行未落实都构成了国家法西斯党面临的糟糕处境，大法西斯委员会需要进行精简和调整以适应国家的发展。\n\n委员会的威望自内战以来逐渐降低，法西斯党内也出现了异见之声，在墨索里尼未听闻处，底下的窃窃私语正不断回荡。\n\n\n\n\n£GFX_idea_Committee_in_danger_desc\n\n\n\n§!"
