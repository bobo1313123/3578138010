 ITAG_Protracted_civilwar: "内战旷久"
 ITAG_Protracted_civilwar_desc: "无论是码头捕捞的渔民，还是城市居住的市民，亦或者田野劳作的农民，都对于战争感到了疲惫，人民的心声不再为战争所振奋，后者摧残了人们的心智和生活，经济一再衰退，社会的弹性减少，我们必须立刻结束混乱的战争状态，回归1861的统一。\n\n\n\n\n£GFX_idea_Protracted_civilwar_desc\n\n\n\n§!"
 
