 POL_Sejm_panic: "瑟姆恐慌"
 POL_Sejm_panic_desc: "如果只是议会内部的叫闹与呼喝，就算是辱骂更甚是拳脚相加，那或许对于刚刚新生的民主制度还算利大于弊。初代目总是不成熟需要多多打磨的，那样才能走出一条符合国情的道路。\n\n可是在纳鲁托维奇连任总统时，反对派们见不得光甚至是违宪的行为都堂而皇之地展示在了台前。先前视察美术馆时对总统的刺杀行动暴露，各大反对派还互相推脱拒不承认，而如今反对派成员公然穿着党服持棍殴打执政党员甚至是无辜的其他支持者。\n\n面对如此暴徒，好一部分议员都从后门悄悄溜进议院，有些干脆称病不来。这般内忧外患的情况下，议院多数时候连一个议案都无法正式通过。"
 POL_Street_brawl: "街头斗殴"
 POL_Street_brawl_desc: "不仅殴打官员和议员，所谓示威者已经彻底沦为了暴徒。打着反犹太主义的旗号，他们对一般的小市民和工人都开始了无差别攻击。而不甘单纯挨揍的左翼和少数族裔受害者同样组成统一战线与右翼对抗，双方在全国街头巷尾大打出手，伤亡者不计其数。左翼工人和右翼资本家走上街头加入混乱，工厂和商店却因此停业乃至更严重的破坏。"
 POL_Ramparts_of_Rotting_Flesh: "腐烂生蛆的血肉长城"
 POL_Ramparts_of_Rotting_Flesh_desc: "两次对俄战争我们打得很漂亮！兴登堡仅仅用那临时组建的杂牌军，就阻挡了红色瘟疫前进的脚步。老元帅挥舞马刀驰骋畋猎，不可一世的白军也被迫低下了他们自认为高贵的头颅，像我们摇尾乞降……至少是如此宣传的。\n\n白俄罗斯和乌克兰重归我们伟大的祖国，贝克部长凭借高超的政治手腕与外交手段将立陶宛落袋为安。波立故地大部尽返祖国。\n\n外敌铩羽，卫国英雄们褪去了神性，所支持他们斗倒政敌爬上高位的人性重踞上风。妖风刮遍波兰大地，士兵在欢愉中开始懒散，军官在荣誉下逐渐贪污，将军在欲望下疯狂争权。\n\n§R尽管我们是生活在伟大波兰的婊子，但我们愿意用自己全身的脏血烂肉筑成保家卫国的防线！§!"


 POL_trench_desire: "人心欲壑"
 POL_trench_desire_desc: "血腥的战争终于结束，那遍布波兰的可悲的残垣断壁充斥着每一位波兰人的眼睛。波兰政府向世界各国求取资助，近乎为乞得的物资与外币马不停蹄地分给了各地的救济署与教会。\n\n起初，这些机构尽心尽责，努力将粮米放给每一位难民。可随着能从外界求得的物资变少，而恢复当地生产却又遥遥无期，一部分官员打算剑走偏锋。\n\n仅存的赈灾款根本不可能养活国民，或许将它们作为本金存入国外银行吃利息是个不错的选择。一是可以通过利息延缓全面亏空到来，二是可以中饱私囊。\n\n在第一桶金飘洋过海回到波兰时，官员们似乎看到了生财的康庄大道。本着“撑死胆大的，饿死胆小的”的心态，大量的赈灾款被投入股市，每个人都有光明的未来……\n\n伦敦股殇彻底摧毁了这群贪官的迷梦，他们惊愕的发现自己的海外资产纷纷化为泡影，波兰政府同样惊愕的发现国库账面的外汇竟也被搬空去炒股…\n\n§R官员们，你们的下落速度和你们持股的跌落速度哪个更快呢？§!"