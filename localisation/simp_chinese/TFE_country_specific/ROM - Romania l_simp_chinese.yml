 ROM_Constantin_Argetoianu: "康斯坦丁·阿尔格托亚努"
 ROM_Nikola_Jorga: "尼古拉·约尔加"
 ROM_Nikola_Jorga_sl_desc: "\n\n\n§Y尼古拉·约尔加§!\n\n\n\n\n\n\n\£GFX_ROM_Nikola_Jorga_large\n\n\n\n\n\n\n\n\n§Y诗人与哲学家§!\n - 稳定度: §G+5%§!\n - 战争支持度: §G+5%§!\n-------------\n§Y生于:§!§L1871年1月17日,罗马尼亚博托沙尼§!\n§L尼古拉·约尔加，20世纪罗马尼亚共和国最具影响力的历史学家、作家与政治家。其天赋极高且极其高产。学术上，他著作等身，作品涵盖历史、文学、哲学等领域，总量超过两万种，被认为是罗马尼亚最多产的作家，也是国际知名的拜占庭学与中世纪史专家。然而其也是罗马尼亚最著名的伪史论学家和右翼反动主义者，其鄙夷1866立宪的成果，认为罗马尼亚的宪政传统应该追溯到1300年的公国时代，并且激烈的反对资本主义与工业化。同时约尔加也与政坛内的各路右翼巨头交好，影响力巨大。\n\n军事独裁者亚历山德鲁·阿维雷斯库因身体原因辞去总统职务后，约尔加成为了共和国的总统，这位反动的右翼诗人，将带着罗马尼亚朝着前现代反民主国家一路狂奔。§!"
