 ROM_hollow_republic: "徒有其表的共和国"
 ROM_hollow_republic_desc: "作为1870反霍亨索伦王朝运动的产物与1848大革命精神的继承者，罗马尼亚共和国曾寄托了所有人的厚望，但最终的表现却很难让人满意。自反王朝运动后，长期执政的自由党为赢得选举而不择手段，而保守党又抗拒改革，在众议院动用一切手段阻止带有进步色彩的法案通过。将罗马尼亚自建国后的30年的政坛称为一摊烂泥简直就是夸奖。\n这种表面上的民主共和最终在1919年的阿维雷斯库政变后彻底露出原型，自阿维雷斯库政变后，罗马尼亚共和国便保持着国家复兴党长期执政的局面，几十年不变。所谓的巴尔干民主灯塔，不过是一个披着现代国家外皮的中世纪王国。"
 ROM_one_party_blowback: "一党制霸的反噬"
 ROM_one_party_blowback_desc: "如今罗马尼亚的第一大党国家复兴党虽说建党于1931年，但其最初的前身应该追溯至1919年的阿维雷斯库政变。这一年，不满民主制的罗马尼亚开国将军亚历山德鲁·阿维雷斯库发动政变，推翻民主制，并整合了原本支离破碎的保守党，并改组为人民党。自此以后该党凭借着阿维雷斯库的个人威望单独执政了将十年。\n当1930年阿维雷斯库将军因为年事已高退休并将党务大权移交给阿尔格托亚努后，阿尔格托亚努便将其改组为了国家复兴党并继续单独执政。但如今单独执政的危害已然显现，国家复兴党在众议院已是孤家寡人，自由党、社会党、农民联盟，每个人都仇视国家复兴党，而国家复兴党也是内部矛盾重重。阿尔格托亚努和他的党，现如今已是强弩之末，只需一点受力，便会华屋化作丘墟。"
 ROM_hedgehog_nation: "刺猬国度"
 ROM_hedgehog_nation_desc: "一般来说，很少用“刺猬”这个词形容一个国家的内政状态，但很不幸，罗马尼亚就是这样的。1881～1931年的领土扩张进程中，罗马尼亚得罪了每一个他的领居，而作为一个小国，却没有任何势力保障他的独立。为了保卫罗马尼亚的独立，共和国将他自己武装成了牙齿，1923年阿维雷斯库时期，罗马尼亚确定了全民兵役制，到了1930年代，罗马尼亚拥有全巴尔干地区规模最大的军队和最高的年军费支出占比。\n将自己化身为刺猬，固然保卫了共和国的独立，但也严重制约了罗马尼亚的经济发展。未来有一天，罗马尼亚必须要终结自己的刺猬状态。"
 ROM_new_sowingism: "新播种主义的复兴"
 ROM_new_sowingism_desc: "从1860年代霍亨索伦王朝入主罗马尼亚到1870年共和国建立后布勒蒂亚努家族巨头长期担任罗马尼亚总统，这段时间罗马尼亚资本主义的发展过程中，罗马尼亚的农民们承受了莫大的苦难。因此，罗马尼亚的知识分子们开始行程反工业化、反民主化的逆流思潮，从旧日的青年主义，到70年代的播种主义，知识分子们无不对资本主义和民主制深恶痛绝。\n1931年尼古拉·约尔加成为共和国总统后，“播种主义”重新复兴起来，并成为罗马尼亚的基本国策。播种主义反对工业化，提倡传统的中世纪农村共同体。这种“诡异的意识形态”，如今占据着罗马尼亚的方方面面。"
