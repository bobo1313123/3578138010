 TFE_title_loc_SOV: "俄罗斯"
 TFE_desc_loc_SOV: "自基辅罗斯开始，她拥有过许多称号，或许欧洲宪兵、战斗民族、军事强权，但都不足以形容这个横跨欧亚的巨熊。俄罗斯以自己的鲜血与汗水在这片冰冻的土地上锤锻出了其独有的文化，更重要的是在这几百年来俄罗斯面对外敌侵略时所表现出坚韧与顽强的“俄罗斯”精神……但在荣耀的表象下，裂痕早已深埋，1914的世界大战中，沙皇的士兵们再一次表现出了属于他们的勇敢，却也在这台东线绞肉机中流干了旧时代的最后一滴血，当革命的风暴来临后，俄罗斯的命运又将何去何从?\n崭新的俄罗斯共和国诞生于内战的废墟上，她剿灭了君主专制带来的民众痛苦，也消灭了布尔什维克带来的赤色恐怖，新生的政权必须在各种坎坷中小心翼翼，否则会再一次陷入到万劫不复的战争中。问题远不止于此，军队中派系林立，指挥官们要么无心作战，要么野心十足，每个人都妄图从这个共和国中尽可能多的咬下一些养分；工业基础的薄弱与大片土地的枯竭更使得综合实力下降。而这绝不是俄罗斯想要看到的模样……\n而现如今，亚历山大 克伦斯基执掌这个国家已四年有余，作为社革党的重要领导人之一，他小心翼翼地谋划着国家的每一步改革。然而作为世界上最富压迫的几个政权之一，俄罗斯内部却充斥着暴力腐败，以及右翼激进分子和保皇派与中央间的冲突，那些人所追求的大俄罗斯版图，是历代沙皇都无法想象的，而总统先生与共和国却不需要灰色牲口，俄罗斯需要的是有尊严，有价值的每一个人民。\n而那群在内战中的失败者或许有朝一日终会卷土重来，到了那时，欧洲大陆乃至整个世界都将面对来自1917年的终焉回响！"
 TFE_welcome_close_loc_SOV: "§C俄罗斯啊，你往何处去？§!"

