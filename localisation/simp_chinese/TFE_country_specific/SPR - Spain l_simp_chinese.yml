 SPR_Command_limit_desc: "西班牙近来多为治安类与内战类的分队作战形式，大兵团作战教学在军事院校寥寥无几"



 SPR_Papal_Meridian: "教皇子午线"
 SPR_Papal_Meridian_desc: "我们当前对美洲的影响力：§Y【中等】§!\n西班牙从未放弃她在新世界的神圣遗产。\n自1494年托尔德西里亚斯条约由教皇亚历山大六世亲手划定，那条分割世界的经线便永恒确立了西班牙对美洲的合法主权。所谓的独立战争，不过是被自由派毒雾暂时蒙蔽的兄弟对母国的误叛。\n\n从哥伦比亚的咖啡山脉到阿根廷的无边草原，从哈瓦那的堡垒到智利南端的海峡，每一寸土地都铭记着西班牙的姓名。那些飘扬的异色旗帜终将褪色。\n\n当我们的舰队再次巡弋于加勒比海，当伊比利亚的十字架重新树立于新大陆，一个属于西班牙的太阳正在冉冉升起，并将永远高悬于阿美利加。\n\n\n\n\n£GFX_idea_Papal_Meridian_desc\n\n\n\n§!"
 SPR_Legacy_of_the_Civil_War: "内战的遗产"
 SPR_Legacy_of_the_Civil_War_desc: "在较早时期，欧洲内战的敌对双方是为了相对有限的目的，内战的经常不过是为了变更统治者。然而，到了20世纪，这些战争变成了革命斗争，具有决定性性质，每一方都寻求建立一种新的社会和文化秩序。每一次革命内战，并不仅仅是一场政治斗争，也是有关社会，宗教与文化的终极冲突。在要求一种完整的，妥协的解决方案。\n\n西班牙内战正是这一转变的典型体现。这场持续三年的血腥战争，给整个国家带来了深重灾难。即便作为胜利一方的国民军，在战后仍面临重重挑战：比利牛斯山脉深处活跃的游击队、被战火摧毁的工业体系、以及成千上万羁押在监的政治犯……这些都成为“胜利之后”必须直面的艰难遗产。\n\n\n\n\n£GFX_idea_Legacy_of_the_Civil_War_desc\n\n\n\n§!"
 SPR_spanish_army: "西班牙军队"
 SPR_spanish_army_desc: "当前军队职业度：§Y中规中矩§!\n当前军方态度：§t轻微不满§!\n长期以来，西班牙军队常因效率低下与战术陈旧而闻名。然而，在阿方索十二世推行军事改革之后，其整体实力已不容小觑。在第一次世界大战与摩洛哥殖民战争中的表现虽不耀眼，但也堪称中规中矩，尤其以参与干预俄国内战的“蓝色师团”为代表，展现出一定的作战素质。\n\n作为国家体制中最具实力的组织，军队被要求忠诚于国家、上帝与最高统治者。然而，内战期间暴露出的战术分歧与指挥冲突，已为政府与军方的关系埋下隐患。若不能妥善维系与军队高层的关系，政权将始终面临一轮又一轮的军事颠覆风险。因此，我们必须持续推进军队的职业化改革，并谨慎回应其诉求。眼前的稳定或许只是表象，真正的风暴，往往潜伏在黎明将至之时。\n\n\n\n\n£GFX_idea_spanish_army_desc\n\n\n\n§!"
 SPR_The_hanging_throne: "空悬王座"
 SPR_The_hanging_throne_desc: "西班牙内战结束后，出现了一个耐人寻味的政治局面：从法律层面看，新政权并未废除君主制，王位在法律上依然虚悬待继；然而在现实中，国家已完全置于一个专制政权的掌控之下。\n\n官方称呼其为“元首”，也有人直言不讳地称之为“独裁者”。如今，这位统治者年事已高，其身后之事逐渐成为各方势力关注的焦点。\n\n自由派期盼能借此机会重建第二共和国；卡洛斯派则视其为恢复王统的最后机遇；军方则选择暂作壁上观，静待局势演变。\n\n然而，对现状最为不满的，或许正是独裁者之子、长枪党领袖何塞·普里莫·德里维拉。在他看来，无论是君主制还是资产阶级共和制，皆已成为西班牙前进的桎梏。唯有由长枪党全面执掌政权，才能真正实现国家的复兴。\n\n\n\n\n£GFX_idea_The_hanging_throne_desc\n\n\n\n§!"
 SPR_Autonomy_Dilemma: "自治难题"
 SPR_Autonomy_Dilemma_desc: "在战后西班牙的灰烬中，没有哪个问题比巴斯克与加泰罗尼亚的自治命运更能象征那场内战的裂痕。这两个地区曾作为共和派的坚实堡垒奋战至最后一刻，如今，胜利的国民军政权决心彻底清算这份“背叛”。他们过去享有的自治权被无情废除，语言文化被公然打压，连最基本的民族象征也沦为非法。\n\n然而，独裁政府的强硬手段并未真正抹去两地人民的身份认同。在加泰罗尼亚，中产阶级与知识界虽在战后初期被迫沉默，但那份对共和岁月的记忆与自治的渴望，只是转入了地下悄然滋长。而在巴斯克，问题则更为严峻：连绵的青山成为反法西斯游击队出没的屏障，分离主义的情绪因镇压而愈发坚定，使得该地区始终是政权体内一根难以拔除的毒刺。\n\n\n\n\n£GFX_idea_Autonomy_Dilemma_desc\n\n\n\n§!"




 SPR_Battlesmoke_dissipated: "硝烟散去"
 SPR_Battlesmoke_dissipated_desc: "我们现在接手的，是一个满目疮痍的国家。硝烟从加泰罗尼亚的山谷散去，在卡斯蒂利亚的平原上留下焦黑的弹坑。空气中不再有炮声，却弥漫着比火药更沉重的寂静那是饥饿、恐惧与难以消弭的对立。\n我看到一座废墟，不止是教堂的断壁和工厂的骨架。更深重的废墟，埋在人民的眼神里，藏在每一个被迫选边站队的家庭裂痕中。土地在等待犁头，而无数双手还残留着握枪的老茧。\n\n§R重建必须从明天破晓开始！§!"
 SPR_at_gunpoint: "被枪所指"
 SPR_at_gunpoint_desc: "内战结束后，枪口并未冷却。\n德里维拉将军将整个国家置于军事管制之下，所有省份的行政长官均由现役军官担任。警察与宪兵队拥有随时搜查与逮捕的权力，任何集会都需要军方批准。\n经济计划在陆军参谋部的会议室里制定。\n工厂的产量、铁路的调度、乃至主要作物的收购价格，都由穿着军装的人员决定。工会被解散后，工人的工资与工时由军方监督部门规定，罢工者按“军事叛乱”论处。\n街头巡逻的士兵有权检查任何人的证件。报纸刊登的内容需经过军事审查办公室盖章。大学里，教授若在课堂上提及被禁的意识形态，很快会接到征兵通知。这里的重建不是通过议会的法案，而是通过军令部的每日通告和无处不在的岗哨来推行。"
 SPR_depressed_nation: "萧条之国"
 SPR_depressed_nation_desc: "在西班牙的土地上，硝烟散去后的寂静比战争本身更令人窒息。\n经济危机的浪潮尚未退去，内战的创伤又深深刻入国家的肌理，将往日的生机撕裂成碎片。走进曾经的工业区，景象触目惊心：工厂大门紧锁，锈迹斑斑的钢铁骨架在连绵阴雨中扭曲变形，破碎的窗户像无数只空洞的眼睛，绝望地凝视着灰蒙蒙的天空。流水线彻底停摆，机器上积满了厚厚的灰尘，油渍早已干涸，仿佛时间在这里彻底凝固，连空气都弥漫着衰败的气息。"
 SPR_general_politics: "将军政治"
 SPR_general_politics_desc: "在独裁政权的体制下，军官集团构成了统治的骨架。各省省长、关键部长乃至大型国有企业的负责人，通常都由现役或退役将军担任。晋升不仅取决于军阶，更与对“民族运动”的政治忠诚度直接挂钩。\n将军们通过一个封闭的系统分享权力与利益。最高国防委员会的决定往往等同于国家政策，而军事法庭则负责审理所有涉及军方人员的案件，形成了独立于普通司法体系的特权阶层。经济上，他们通过控制进口许可证、金融信贷和基础设施建设合同，将国家资源转化为集团私利。\n任何行政决策或经济计划，首先需在军方高层内部达成妥协。文官机构的角色被严格限定在执行层面，实质性的治理权始终掌握在穿着制服的人手中。这一结构确保了政权的稳定，但也使国家长期陷于僵化的军事官僚管理模式之中。"
 SPR_Enemy_in_Mountains: "山中之敌"
 SPR_Enemy_in_Mountains_desc: "内战结束后，胜利者书写历史，但山区里仍有笔尖之外的墨迹在流动。在西班牙北部和比利牛斯山脉的褶皱里，游击队像野草一样扎根。\n这些游击队被我方正式定性为“赤匪”、“红色匪帮”及“恐怖主义残余势力”。这些家伙由内战失败后流窜的武装分子与部分受国际颠覆思想煽动的本土极端分子构成，其成员藏匿于北部及比利牛斯地区的非法匪巢中，包括自行挖掘的洞穴、废弃矿道以及临时搭建的违章窝棚。我们确信其受到国外敌对势力的遥控指挥，企图颠覆国家合法政权，并持续对其进行必要的清剿与法律制裁，以保障国民安全与领土完整。"
 SPR_Rusted_gear: "生锈齿轮"
 SPR_Rusted_gear_desc: "内战后的西班牙工业，如同一台庞大而锈蚀的机器。钢铁厂、造船坞和煤矿这些核心部件在战争中受损尤为严重，且修复过程缓慢而低效。国家主导的投资并未带来技术革新，反而固化了陈旧的生产模式。许多工厂继续运转着二三十年代的老旧机床，齿轮在缺乏润滑的摩擦中发出刺耳的声响。\n整个工业体系就在这样的锈蚀与摩擦中空转。它消耗着国家的黄金储备与人民的劳动，却未能输出足以驱动繁荣的真正动力。当邻国的经济机器在战后飞速迭代时，西班牙的工业齿轮只是在自身的铁锈中，缓慢地磨损着。"
 SPR_Dirty_war: "肮脏之战"
 SPR_Dirty_war_desc: "独裁政权对巴斯克地区实行高压统治，剥夺其自治权，并禁止使用巴斯克语。作为回应当地的巴斯克民族分子纷纷成立抵抗组织，以暗杀和爆炸为主要手段开始对马德里方面的回应。\n我们的政权将对巴斯克抵抗组织的剿灭视为一场维护统一的战争。安全机构对少数族裔聚居区进行全面监控，任何集会或语言异动都可能招致逮捕。审讯室内允许采用“必要手段”获取情报，嫌疑人的供词往往在黎明前签署。\n作为报复，恐怖分子选择最易造成恐慌的方式。炸弹被放置在市场或车站，袭击对象从警察逐渐扩大到任何为政权服务的公务人员。他们不区分军装与便服，正如我们的清剿行动也不严格区分武装分子与同情者。"
 SPR_Must_be_faced: "不得不面对的"
 SPR_Must_be_faced_desc: "我们的政权将任何形式的自治诉求视为对国家统一的直接威胁。在少数族裔聚居区，地方政府完全由我们直接任命的军事长官控制，所有市政文件必须使用卡斯蒂利亚语签署。当地语言被禁止在学校、出版物及公开场合使用，违者按破坏国家文化统一论处。\n这种压制并未消除自治诉求，而是将其驱入地下。秘密的语言学校在深夜的地下室开课，被查禁的民歌以更隐蔽的方式传唱。当表面的顺从成为常态时，政权不得不面对一个事实：我们无法战胜它们，加泰罗尼亚与巴斯克的旗帜仍然在暗中飘扬。"
 SPR_Better_soldier_Easier_policy: "精兵简政"
 SPR_Better_soldier_Easier_policy_desc: "我们的政权面临着军队日益臃肿与腐败的难题。战争结束后，大批军官凭借战功转入政府和国有企业，形成了盘根错节的利益集团。军费开支长期占据预算首位，而许多部队单位实际上已沦为安置冗员的虚衔。\n改革从精简编制开始。我们试图削减将军员额，合并冗余的军区指挥机构，并让部分军事产业转型民用。然而，每一次整编都遭遇无形的抵抗。被裁撤的番号往往以“战略预备队”的名义变相保留，裁减的军官则被调往新设立的闲职部门。采购装备与工程承包中的回扣链条，早已渗透到国防部各个层级。"
 SPR_Necessary_reforms: "势在必行的改革"
 SPR_Necessary_reforms_desc: "面对持续的衰退与国际孤立，我们的政权被迫调整方向。技术官僚被引入经济决策层，他们制定了“稳定计划”，逐步放宽部分国家管制，吸引外资并鼓励旅游业。比塞塔的汇率得以统一，部分国营企业开始尝试有限的效率核算。\n这些措施并非根本性的转向，而是在不触动政权根基的前提下，为经济机器注入有限的润滑剂。重工业与金融的核心利益依然由旧有集团把持，农业地产结构纹丝未动。改革带来了外汇和些许市场活力，却未能撼动那个庞大而低效的体系。"
 SPR_The_old_lion: "雄狮暮年"
 SPR_The_old_lion_desc: "晚年的德里维拉已很少离开埃尔帕尔多宫。他的身体需要医疗小组全天候监护，每日清醒的时间在不断缩短。但国家机器的所有关键齿轮，依然被锁在他那只布满老年斑的手中。\n内阁名单的任免、军队晋升的最终裁决、乃至重要外交函件的措辞，仍需由他本人在病榻上以颤抖的笔迹签批。他将衰老的身体变成了权力的最后一道壁垒，任何关于权力交接的具体安排都被无限期推迟。身边的亲信们只能围绕着一个日渐沉默的老人。"
 