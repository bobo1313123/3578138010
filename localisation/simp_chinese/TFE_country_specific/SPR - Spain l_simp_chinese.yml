 SPR_Miguel_Primo_Derivella: "米格尔·普里莫·德里维拉"
 SPR_Miguel_Primo_Derivella_desc: "§Y出生日期:1870年1月8日§!\n§L当米格尔·普里莫·德里维拉将军在1931年那场流血的政变中接管西班牙时，这个饱受政局动荡和殖民地战争折磨的国家，似乎终于迎来了一位能挥舞军刀斩断乱麻的强人。他来自安达卢西亚的贵族家庭，在摩洛哥和殖民地的赫赫军功为他赢得了威望。国王阿方索十三世的默许，更让这次行动披上了拯救国家于危难的光环。他承诺用“国家、宗教、君主制”的铁腕配方，为西班牙带来秩序与稳定，一场自上而下的“手术”即将开始。\n\n上台之后，他立刻开启了与，社会党人无政府主义者和分离分子的肮脏战争，直到1934年11月，训练有素的摩洛哥非洲兵团踏进了叛乱者在加泰罗尼亚的最后一个据点时，这场血腥的内战才终于结束，而这位独裁者也真正的掌握了整个国家。只不过现在就有你西班牙的雄狮，已年近七旬，却仍然大权在握不肯放手，这无疑让人民在心中产生了一个巨大的疑问，独裁者之后又会是谁呢？§!"
