 SYR_Feudal_society: "封建社会"
 SYR_Feudal_society_desc: "尽管政府大力推动国家的现代化，但叙利亚统治者本身就是大多属于与现代化对立的封建阶级，因而这些努力收效甚微，时至今日叙利亚都没能冲破封建社会的桎梏。小农经济、强大的封建地主、低得可怜的识字率都对国家的建设造成了极大的负面影响。"
 SYR_National_Revolutionary_Army: "民族革命军"
 SYR_National_Revolutionary_Army_desc: "1930年伊拉克革命不仅局限在两河流域下游，而是在爆发后很快传播到了叙利亚地区。在伊拉克革命者的支持下，叙利亚国内不满土耳其和王室封建统治的进步地主、知识分子和工农很快在阿特拉什苏丹的带领下联合起来发动了对哈希姆王室的大起义。尽管由于缺乏准备起义并未成功，但起义者组成的“民族革命军”却幸存了下来，继续在暗中积蓄力量，预备在未来的某天为叙利亚和整个阿拉伯世界赢得真正的解放。"
 SYR_Beneath_Prison_Cage: "囚笼之下"
 SYR_Beneath_Prison_Cage_desc: "当阿拉伯大起义胜利结束时，叙利亚人曾以为自己终于迎来了200年未尝品鉴过的自由。毕竟土耳其已四分五裂，而协约国业已崩溃，还有什么能阻碍叙利亚和阿拉伯的崛起呢？\n\n然而短短不到十年之后携带着滔天复仇怒火的土耳其军队便打碎了他们人的幻梦。面对强大的入侵者，仅仅几次战斗后，叙利亚王国就不得不与土耳其议和。其结果是：国家的整个北部地区被土耳其重新纳入其领土当中，王国也被迫成为了北方突厥人的傀儡。\n\n现在，土耳其的企业把控着叙利亚的国民经济命脉；土耳其的顾问团架空了王室，成为政府的实际控制者；叙利亚被禁止拥有5万人以上规模的军队，并且其训练大多由土方负责。来自伊斯坦布尔的触手已然将叙利亚紧紧缠绕，要将她勒死。而尽管费萨尔国王仍在不断尝试与土耳其周旋，为叙利亚争取一定的自主，到目前为止，这触手仍愈收愈紧。"
 SYR_Beneath_Prison_Cage_tt: "§R不可训练、改编、解散部队§!"