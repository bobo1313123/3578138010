 YUG_communism_party: "§R非法§!"
 YUG_communism_party_long: "§R南斯拉夫社会主义工人党（非法）§!\n§g社会主义工人党是一个马克思主义和南斯拉夫主义政党，在改良主义和革命愿望之间徘徊。社工党成立于1919年，在波斯尼亚黑塞哥维那工人组织的倡议和塞尔维亚社会民主党的号召下，各社会民主党和社会民主主义组织召开了统一大会，最终决定建立南斯拉夫工人阶级统一的政治组织，即南斯拉夫社会主义工人党。以前社民党人日夫科·托帕洛维奇为核心的温和沙文主义派系被驱逐出党。在亚历山大二世的王室独裁统治下，社工党很快便被宣布为非法政党。§!"
 YUG_Socialism_party: "§R非法§!"
 YUG_Socialism_party_long: "§R南斯拉夫社会民主工人党（非法）§!\n§g社民党来自社工党的议会派分子，他们认为当今塞尔维亚乃至整个欧洲并没有为革命做好准备。在被逐出党派后该党便组建了社民党，意图效仿德法社党的议会斗争。然而在一月六日独裁后该党至今未恢复参会权限。§!"
 YUG_Progressivism_party: "§R非法§!"
 YUG_Progressivism_party_long: "§R南斯拉夫进步民主联盟（非法）§!\n§g欧洲列强们的资本主义与工业发展贯穿了塞尔维亚，由此诞生了塞尔维亚进步主义。在激进党上台后，心怀不满的自由派转而脱离成立了独立激进党，强烈的议会主义、民主主义甚至是社会主义使其不可避免的与专制王朝为敌，在里耶卡并入南斯拉夫后该组织力量再次得到了加强，沿海地区对于民主和平等的诉求也愈演愈烈。§!"
 YUG_Liberalism_party: "人民激进党"
 YUG_Liberalism_party_long: "南斯拉夫人民激进党\n§g卡拉乔尔杰维奇王朝复辟后，人民激进党便登上了执政党之位。此后，它逐渐从原先带有一定民主诉求的政党，演变为代表大塞尔维亚资产阶级利益的保守力量。在一战及战后建立南斯拉夫王国的过程中，帕希奇主导的外交政策先是亲俄，后转向亲法，其核心目标是围绕塞尔维亚实现南部斯拉夫人的统一，并谋求塞尔维亚在该地区的主导地位。\n\n南斯拉夫王国成立后，人民激进党继续在政坛扮演关键角色。1920年代初的多届政府均由该党成员出任首相，而帕希奇本人也在1921年至1926年断断续续的担任王国首相，推行保守的内政与维护巴尔干稳定。1926年帕希奇去世后，该党仍维持了一段时期的影响力，但内部凝聚力逐渐下降。最终在国王建立独裁统治后被禁止，尽管在宪政恢复后被重建，但其影响力早已不复当年。§!"
 YUG_Democracy_party: "自由党"
 YUG_Democracy_party_long: "南斯拉夫自由党\n§g1921年《维多夫丹宪法》颁布后，遭到了海岸边的克罗地亚人的集体抵制，但特鲁姆比奇深知这里并没有北方的同胞一样有一个统一的组织与领袖，同时他也是一名南斯拉夫主义者，于是他决定借助当地的教会网络让大家能够进一步团结以抵制贝尔格莱德的政策。同时他与其他民族组织合作成立了联合阵线，参与议会为抵制不合理政策而努力。§!"
 YUG_Conservatism_party: "南斯拉夫穆斯林组织"
 YUG_Conservatism_party_long: "南斯拉夫穆斯林组织\n§gJMO的核心目标是维护波斯尼亚穆斯林的宗教与领土利益。它在竞选时往往诉诸宗教口号而非民族身份，甚至将不投票给该党称为一种“罪过”。它反对穆斯林向奥斯曼移民，并在伊斯兰宗教机构中拥有相当大的影响力。\n\n在1921年制宪议会中，JMO 的支持对通过《维多夫丹宪法》至关重要。作为交换，其关于波斯尼亚和黑塞哥维那领土完整、宗教自治以及沙里亚法权利的要求，以“伊斯兰条款”的形式被纳入宪法。不过，这种与塞尔维亚执政党的结盟关系并不稳固，此后JMO也曾与克罗地亚自由党短暂联合，并在1925年联盟破裂后一度陷入孤立。§!"
 YUG_Authoritarianism_party: "国家党"
 YUG_Authoritarianism_party_long: "南斯拉夫国家党\n§g1929年，亚历山大陛下建立了独裁统治，并使王家卫队指挥官佩塔尔·日夫科维奇将军建立了该党以巩固统治，期间随历经波折，但有国王的担保使得国家党至今依然屹立不倒。§!"
 YUG_tttt_party: "卡拉乔尔杰维奇王朝"
 YUG_tttt_party_long: "卡拉乔尔杰维奇王朝\n§g奥布雷诺维奇王朝的亲奥政策使得许多塞族人民极为不满，1903年黑手社头目德古拉廷发动政变推翻了旧王朝，并迎回了卡拉乔尔杰维奇家族，由此塞尔维亚转变为了一个亲法俄的国家。§!"
 YUG_fascism_party: "南斯拉夫民族运动"
 YUG_fascism_party_long: "南斯拉夫民族运动\n§g奇异搞笑，鉴定为墨索里尼爱徒。身为一党之首的廖蒂奇并没有专心发展组织而是投入到了意识形态构建之中，这个新兴党派又将斩获多少票数呢？§!"
 YUG_nazism_party: "§R非法§!"
 YUG_nazism_party_long: "§R南斯拉夫民族社会党（非法）§!"

 YUG_Alexander_I: "亚历山大一世"
 YUG_Alexander_I_desc: "§Y生于:§!§L1888年12月16日,黑山采蒂涅§!"

 YUG_Victorious_Outcome: "胜利战果"
 YUG_Victorious_Outcome_desc: "1917年，随着奥匈帝国单独退出战争，塞尔维亚终于摆脱了北方帝国的残酷统治，还获得了不小的战果——波斯尼亚与达尔马提亚，这让我们距离塞族一统又近了一步，我们却为之付出了整整一代人……但这并不会击垮我们，塞尔维亚人依然挺立。"
 YUG_IMROs_Border_Harassment: "IMRO的边境袭扰"
 YUG_IMROs_Border_Harassment_desc: "《讷伊条约》签订后，该组织逐渐转变为保加利亚收复马其顿的爪牙，并在此后的十余年间不断在马其顿地区开展恐怖活动，为巴尔干蒙上了一层阴影。"
 YUG_Interrupted_Agrarian_Reform: "中断的农改"
 YUG_Interrupted_Agrarian_Reform_desc: "战争结束后，塞族农民与退伍军人迫切寻求新的土地，激进党政府与彼得一世国王顺势在波斯尼亚地区推行土地改革，将异族地主的土地补偿给这些群体。但由于20年代持续的党争与妥协导致改革最终不了了之，现今的塞尔维亚仍是一个落后贫瘠的农业国。"
 YUG_Croatian_Social_Network: "克罗地亚社群网络"
 YUG_Croatian_Social_Network_desc: "为了抵抗贝尔格莱德的中央集权政策，虽然克罗地亚人没有北方匈牙利属区那样有一个统一的领导，但依靠天主教会的网络，克罗地亚人至今依然坚守着基层地区，为我们的统治带来困扰。"
 YUG_Stagflation: "经济滞涨"
 YUG_Stagflation_desc: "1929年，恐怖的伦敦股灾迅速波及了全世界，对我国本就不堪的的经济造成了毁灭性打击，僵化的专制统治更是使得南斯拉夫的经济几近停滞。"
 YUG_The_Yugoslav_military_1: "南斯拉夫的军队：徒有虚名"
 YUG_The_Yugoslav_military_1_desc: "在巴尔干战争和一战期间，塞尔维亚军队的素质得到了对手的公开认可。但到了南斯拉夫时期，塞族军官虽然在军队中占据绝对主导地位，其质量已严重下滑。军队基层塞入了大量克族、波族士兵，军官团质量显著退化、裙带关系普遍、装备严重落后…这些都使这支斯拉夫的军队早已往日不复。"
 YUG_Balkan_Entente_Member: "巴尔干协约国成员"
 YUG_Balkan_Entente_Member_desc: "由于保加利亚常年放任IMRO的恐怖活动，为了维护战后凡尔赛秩序，我国与希腊、罗马尼亚、奥斯曼帝国建立了巴尔干联盟，并在之后进一步成立了巴尔干协约，保障巴尔干半岛的势力平衡与和平安宁。"