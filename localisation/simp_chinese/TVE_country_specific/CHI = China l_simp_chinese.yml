l_simp_chinese:
#idea
 CHI_Aftermath_of_the_stock_market_crash_1: "伦敦股殇"
 CHI_Aftermath_of_the_stock_market_crash_1_desc: "席卷世界的大萧条浪潮汹涌而来，中华民国外贸根基轰然倾覆。外销丝茶、矿产销路骤断，城市工矿大批歇业倒闭；乡间粮价暴跌、农产滞销，乡村经济全面瓦解，无数农户破产流离。流民数目与日俱增，山野匪势愈发猖獗，各处民变此起彼伏，地方治安岌岌可危。\n\n内忧之下，朝野党派依旧隔阂深重。执掌中枢的进步党与身为在野主力的国民党，未曾携手共渡国难，反倒相互攻讦、往复掣肘，朝堂政务阻滞难行，救灾安民举措迟迟难以落地。加之南方各省自治权重颇高，中央政令难以一统四方，全国统筹的赈济、纾困法案无从推行。各省只能各自筹措方略勉力自保，更借机以经济困局诘难中枢，央地嫌隙愈发激化。内困外压交织叠加，偌大民国步步深陷全方位的家国危局之中。\n\n£GFX_idea_CHI_Aftermath_of_the_stock_market_crash_1_desc"
 CHI_Difficult_Industrialization_1: "工业化堪为艰"
 CHI_Difficult_Industrialization_1_desc: "北洋廿四载，实业之途颇类老牛破车。袁公当国之初，修宪改制，设局劝工，然新政多承前清积弊，譬如旧屋糊新纸，梁柱已蠹。各局总办坐领乾薪，机器进口竟有以朽木充箱底之奇闻。赤方之地，除金陵，广州，长沙等城郭，皆荒蛮无度，瘴气丛生，似刀耕火种之时节。"
 CHI_Year_of_Career_Success: "正值事业之年"
 CHI_Year_of_Career_Success_desc: "袁世凯先生励精图治，舞精诚团结，抵外侮于国门，贡殷为国，现时已三十多余年，今正值暮年有智，矢勤矢勇，中华之光景将续继由袁先生统领！"
 CHI_super_president: "超级大总统制"
 CHI_super_president_desc: "自新约法颁颂伊始，大总统总揽治权，权利所达之巅可与秦皇汉武相匹。数年来，外媒舆论尝言：“项城手定宪章，虽无帝王之名，然教令所出实逾九鼎。”金陵之疏影早便撕扯凋零，燕京阙里之槐荫却已遮蔽云霄。\n\n时人夜过新华门，但见双铁狮仍似辛亥年间威武雄壮，然“共和”二字墨迹，已于无人留意之角落，褪色干涸……"
 CHI_Rise_of_nationalism: "民族主义崛起"
 CHI_Rise_of_nationalism_desc: "瞰我东亚之时局，西至迪化，东抵奉天，皆属五色旗飘扬乘风之地，皆为“中华国货”遍及之处。各校学人高举“五族共和”之大旗，开设讲堂作证“中华民族”论调。\n\n观黄浦江畔杂店国货陈列，顾维吾尔之商铺国文牌匾，“华夏共荣”之意便于此具现。"
 CHI_slow_school: "府学啄玉徐缓"
 CHI_slow_school_desc: "前清光绪三十一年，距清帝退位仅余七年久时，朝廷终悔若不大刀阔斧改革帝国将倾灭之理，遂于此年正式废除科举制.然为时已晚，清国从上至下均已似冢中枯骨再无力回天。\n\n大统领以新政总设计师自居，自莫步前清固步自封之后尘，于上任以来便就教育领域行改革之事，破旧害修新宪，广设西洋学堂.然二十余年已过，此番改革成效却未如预期般使科教领域焕然一新，相反，改革过程中充斥着腐败与迟缓，现如今已成尾大不掉之势，连年赤字也使统领愈发对此失望.倘若无及时再立新法，可遇见之未来，我大中华恐会流露“往来皆白丁”之盛况。"
 CHI_Yuan_pride: "袁帅武威扬望"
 CHI_Yuan_pride_desc: "镇压叛乱，卫戍边疆，改善民生-----此等功绩若置于任一国人履历当中，史书必会为其留足浓墨重彩之一笔.伟大统领袁项城亦入其列.\n\n自宣读就职大总统以来，项城便为民国无可争议之统领，然南方诸匪并未如此思忖，妄糟践我统领治国宏图，多次于明暗挑拨事端-----直至第二次粤桂战争.\n\n龙许剿灭联军桂寇谭浩明后，南北正式统臣于统领一人之下，再无割据之局，也使我统领声威权望达至顶峰-----理应如此.\n\n可五洲四海之袁帅画像不过图于表象，若有朝一日此孱弱平衡均消失，届时，神州大地亦将沦为人间炼狱……"
 CHI_Beiyang_army: "刀枪鸣北洋军"
 CHI_Beiyang_army_desc: "新式陆军可谓我政府改革之模范与楷模领域；鸦片战争后，即使清政府行多次变革之举，然仍未达现代化之效，更于日清战争中一表纸老虎本色.\n\n书页翻至民国五年，统领沿清末新政，就我军外强中干之弊病此事大加整顿.时至今日，我军已于军械装备层面整肃完毕，虽军中屡报纪律问题，但就整体情况而言，北洋军以进步颇多，且仍以此速络续发展。"
 CHI_farmer_eco: "佃农家经济依"
 CHI_farmer_eco_desc: "在施行多方面多种措施政策推行工业化，一支不争之事实依旧一直于诅咒般将我国牢牢困于其中，此便为根深蒂固之佃农经济。\n\n该经济模式已扎根于九州千年久，不仅局限经济——社会，思想乃至文化均受其制约，如此盘根错节绝非一朝一夕可牵动矣，好似紧箍咒般，任凭如何挣扎，终只以回溯原点为结语。\n\n而今，此等诅咒已愈发明显，伦敦股殇又猛添干柴，外界纷纷扬言：“中国经济，现进入垃圾时间”……\n\n制度变革刻不容缓，四万万人民翘首以盼等待着明日天安门之动向，然，此等耐心已接近尾声，体制内有序改革若令人民知晓无法兑现，“革命”，亦将成为第二选项。"

CHI_idea_constitutional_amendment_crisis: "修宪风波"
CHI_idea_constitutional_amendment_crisis_desc: "1913年拟定之《中华民国宪法》，条文之中深蕴联邦主义色彩。国民党人竭力护持此部宪典，但是党魁宋教仁却对其中若干条款颇有微词，未能全然心悦。宋教仁辞世之后，国民党籍议员推动修宪议程，削除原本赋予总理解散国会之权，国会权柄由此大为扩张，民国遂步入“国会霸权”之局。内阁行政举措，动辄受国会多方掣肘，政令推行处处受缚。\n\n洎乎进步党登台组阁，这部宪法反倒成为其施政最大阻滞。进步党总理汤化龙锐意促成宪制改订，为达修宪之目的，竟不惜策动所谓“公民团”。此辈多为市井流民、贩夫走卒拼凑而成，假托民意之名，围堵国会，喧嚣滋扰，威逼异党议员屈从修宪诉求。议院之内，议员每因宪制条文之辩，动辄拳脚相向；四方各省，亦纷纷通电驰书，诘难政府修宪之举。围绕修宪而起的层层政潮迭起不休，持续冲击本就根基孱弱的民国制度架构，共和宪政岌岌可危…\n\n£GFX_idea_CHI_idea_constitutional_amendment_crisis_desc"
CHI_idea_asia_first_democracy: "亚洲第一民主国"
CHI_idea_asia_first_democracy_desc: "中华民国以革命手段废除帝制，确立主权属于国民的共和原则，颁布宪法，设立国会，尝试构建责任内阁，打破了“君权天授”的东亚传统政治逻辑。它向整个亚洲昭示：君主并非国家之当然主宰，国家主权当归于全体国民，为朝鲜、东南亚诸多民族的反专制、求立宪的民族解放运动提供了范本，启迪了东亚各国的民权思潮。\n\n£GFX_idea_CHI_idea_asia_first_democracy_desc"
CHI_idea_pacify_the_interior_first: "攘外必先安内"
CHI_idea_pacify_the_interior_first_desc: "国权主义：国家独立自立处理自己内外事务，管理自己国家的最高权力。主权是国家区别于其他社会集团的特殊属性，是国家的固有权利。这表现为：\n1.对内最高权，即国家对它领土内的一切人（享有外交豁免权的人除外）和事物以及领土外的本国人实行管辖的权力，有权按照自己的情况确定自己的政治制度和社会经济制度；\n2.对外独立权，即国家完全自主地行使权力，排除任何外来干涉；\n3.自卫权，即国家为维护政治独立和领土完整而对外来侵略和威胁进行防卫的权力。\n\n近代西方的“国权主义”，随着政党政治理论传播，漂洋过海，成为进步党的主要意识形态，与国民党所秉持与自由平等基础之上的“民权主义”相撷抗，持“国权主义”的进步党政府积极主张“安内”为先，以武力讨平南方，是该党建设强善政府实行稳健主义至关重要的一步。\n\n“民国宪法，宜以巩固国权为主义，国权巩固，国力自张，然后有发达民权之可言。欲巩固国权，则凡障碍国权发动之制度决不可采”\n\n£GFX_idea_CHI_idea_pacify_the_interior_first_desc"
CHI_idea_divided_national_conscience: "国心两歧"
CHI_idea_divided_national_conscience_desc: "“窃计中国存亡，决于今次选举，若激烈派竟占多数，则暴民政治之局遂定，国家决永沦九渊”。在持“稳健主义”的进步党党魁梁启超看来，暴民政治的恐怖可以把已经羸弱不堪的国家推向绝境。而国民党掌握武力，进步党合新军之力，以蔡锷为武力后援，武力成为政党倚赖的根本，“今日中国决不能有政党之发生，凡政党之势力者，无不恃武力为之拥护”。随着两党的冲突不断加剧，向以“稳健”为主义的进步党愈发倾向使用“暴烈”手段肃清国民党，“为世道人心起见，不得不从诸贤之后，借武力以图匡救。明知暝眩之药，然欲疗积痼，安能不用”\n\n国民党既以革命正统自命，深虑共和革命之果实复遭攘夺，遂联络南方诸省，暗中整军经武、冶铸枪炮，厉兵秣马以待时变，存“三次革命”之预备，冀以武力捍卫民元以来之革命基业。\n\n£GFX_idea_CHI_idea_divided_national_conscience_desc"
CHI_provincial_autonomy_central_local_rift: "省宪自治：央地不和"
CHI_provincial_autonomy_central_local_rift_desc: "“省宪自治”，即各省自行制定省宪法，以省宪划定本省官制、议会、司法、财政、军备，组织本省省政府；省权来源于省民全体，而非中央授予。\n\n民国初建，国体底定之后，国家结构之取舍遂成为朝野博弈的焦点。联邦主义一时蔚为思潮，颇多开国元勋为之倡言。然国民党核心制宪人物宋教仁组阁秉政之后，却明确对联邦模式持异议；惟联邦思想已然在国民党内部浸淫日久，渐成多数党员心照不宣之共识。围绕央地权限如何划分，制宪会议往复辩难、拉扯不休，几经折冲，最终以省宪自治之制写入宪法——名义上维系单一制外壳，内核却蕴含浓厚联邦色彩。\n\n省宪自治运行二十余载，并非奠基于举国同心，实仰仗地方实力派武力为其后盾，兼赖国会内省宪同志会的一厢情愿。由此衍生之政治纠葛层见迭出，矛盾潜滋暗长。迨主张建立“强善政府”的进步党组阁执政，便以消弭地方割据隐患为务，屡谋裁抑、废除省宪自治制度。1932年，进步党政府颁令，直、鲁、豫三省率先废止省宪自治，改归中央直接统辖。\n\n此举一出，各地疆吏为之震恐不安。各省为自保计，截留关盐税源，加紧编练省军，扩充地方武力；中央亦整饬军备、秣马厉兵，双方猜忌日深，央地裂痕愈演愈烈。山雨欲来，一场足以撼动国运的巨大浩劫，已然隐现于时局之中…\n\n£GFX_idea_CHI_provincial_autonomy_central_local_rift_desc"
CHI_renshen_military_reform: "壬申军改"
CHI_renshen_military_reform_desc: "1932年，北京政府宣布“军改”，任命蔡锷为新军督办，其军事改革思想以构建近代化国防军体系、塑造职业军人精神、确立军队国家化原则为核心，融合德日近代军事制度与中国传统治军智慧，核心目标是把旧式私家军队改造为服务共和国的现代国防力量。\n\n但这一举措被反对派评价为“欲用于平内而非御外”同时军改也是蔡锷个人权力扩张的工具，借“捍卫共和”的美名毁坏“省宪自治”\n\n£GFX_idea_CHI_renshen_military_reform_desc"
CHI_idea_banner_of_moderation: "“稳健”为帜"
CHI_idea_banner_of_moderation_desc: "“稳健主义”，即采用非激烈、非暴烈手段，采用不激不烈的温和政治、法律途径来解决政见不同，借政党之力将国家引入正途，渐入佳境。“不取急躁，不重保守，惟以稳健为第一要义”。这与宿有革命传统的国民党大相径庭，稳健渐进的改革，会兼顾旧官僚、绅商、新式知识分子等多方社会力量，不是单纯代表某一派激进诉求。通过妥协磋商达成立法与政策，有利于凝聚更广的社会共识，防止社会撕裂；尤其对于工商业发展而言，政策平稳连续，能够给实业、资本提供可预期的制度环境，保护民族经济成长。\n\n£GFX_idea_CHI_idea_banner_of_moderation_desc"
CHI_limited_education: "教化未广，文教不兴"
CHI_limited_education_desc: "此宪政时代的新式教育，造就一批足以支撑工业化、议会政治的精英群体，却陷入了“局部高度现代化，广大底层近乎被遗忘”的困境。国家拥有光鲜的高等教育，而大半国民依旧困于蒙昧；实业蓬勃带来的教育红利，被省域割据、财力不均、军政私心层层截留。教育的繁荣只属于部分地区与部分阶层，并未真正泽被全民，文明开化与普遍蒙昧并行，成为民国宪政盛世之下难以消解的巨大隐忧…\n\n£GFX_idea_CHI_limited_education_desc"
CHI_idea_controversial_jiaxu_parliament: "备受争议的“甲戌国会”"
CHI_idea_controversial_jiaxu_parliament_desc: "1934年产生的新国会，相较于往届国会选举，充满了暴力、恐吓、诬陷和贿选等情节，都督圈荐、金钱贿收、伪造票证、排斥异己，各党派为争夺议席，手段无所不用其极。\n\n£GFX_idea_CHI_idea_controversial_jiaxu_parliament_desc"
CHI_idea_XianZheng_Shiye: "宪政稳实业兴"
CHI_idea_XianZheng_Shiye_desc: "二次革命结束后，南北罢兵息戈，华夏挣脱兵燹连绵的困局，迈入一段政局安稳的宪政岁月。\n\n国会依托宪制权责，次第颁行工商律法，划定产业权责、约束苛捐摊派，以国法筑牢民族实业的根基；又稳步推进关税自主谈判，为本国棉纱、矿冶、丝茶各业竖起保护性壁垒，对内放宽营商门槛，对外守住经济主权。一众革命元勋不再专力戎马政争，孙中山等一众元老抽身政坛纷扰，躬身投入垦荒建厂、兴办农商的实业大业，以名望筹资本，以阅历兴产业，感召大批绅商学子投身工矿建设。\n\n在统一且较为稳定的北京宪政府统筹之下，中华工业化不再随战乱起伏飘摇，循着轻纺先行、重工筑基、农商共生的步调稳步攀升，国力蒸蒸日上。\n\n但随着央地矛盾恶化，不少省份都督借兴办工业化之名，行壮大私军之实：大肆筹办冶金、机械、兵工厂房，表面打着发展地方经济、完善本土基建的名号，实则暗中冶炼钢材、仿制枪械弹药，扩充本省武装军备；截留本地工商税收、工矿盈利，大半钱款并未投入民生改良与轻工拓展，转而充作军费，扩充卫队与地方部队…\n\n£GFX_idea_CHI_idea_XianZheng_Shiye_desc"

#角色
CHI_Tang_Hualong: "汤化龙"
CHI_Tang_Hualong_leader_desc: "§C汤化龙，字济武，湖北浠水人\n\n出身鄂东经商耕读世家，饱读旧学，受楚文化经世风气、张之洞湖北新政、维新思潮熏陶，笃信君主立宪制，武昌起义爆发后，汤化龙迅速转向共和革命，为湖北军政府政务处长。民国建立后，先后组建共和建设讨论会、民主党，与梁启超合组进步党，对抗国民党，提出国家重心力、调和论两大核心宪政思想，主张依托强势中央政权，以议会调和南北、党派矛盾，循序渐进建成完备共和；1916年宋教仁逝世，1917年国民党发动政潮导致进步党解体，汤化龙在国会中持“不党主义”，1926年与梁启超合作建“新进步党”，被推举为内阁总理后，自视为中华民国的“国家重心”，长期站在地方士绅、中小商人立场，批判中央官僚集团独揽财权、路权。其长期面向各省商会与乡绅演说，以“国民公意”对抗敌对党。任用蔡锷编练“新军”，以此为根据壮大中央，接着逐步推进“修宪”，将中华民国拉回单一制轨道。\n\n§Y补充：由于其行事激进强硬，极具演说才能与舆论影响力，且着重培育中央军政势力作为稳定支柱，利用修宪剥夺国民党旧议员资格，引起国民党的极度恐慌，被孙中山等人定性为“共和破坏者”“袁世凯第二”，针对汤化龙的刺杀行动一直没有停止…§!§!"
