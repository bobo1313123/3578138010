EU_IN_ONLY: "欧罗巴的孤儿"
EU_IN_ONLY_desc: "爱尔兰在欧洲是孤独的。它拥有一套与相近国家不同的语言与文化，它从未沐浴罗马的教化，也没有屈服于不列颠的铁蹄。凯尔特的血脉塑造了爱尔兰人勇敢的特点，为独立而斗争的历史赋予了爱尔兰人永不屈服的意志。\n\n\n\n\n\n£GFX_EU_IN_ONLY_desc\n\n\n\n\n\n"
green_island: "翡翠之岛"
green_island_desc: "爱尔兰是欧洲最美丽的岛屿，她像放在在蓝色绒布上的一块绿宝石般闪耀，她像茫茫大海上的女神般美丽。爱尔兰人热情地歌颂着他们的祖国，庆祝这来之不易的独立，爱尔兰的独立不可侵犯，直到永远。\n\n\n\n\n\n£GFX_green_island_desc\n\n\n\n\n\n"
