IRE_kesilin: "迈克尔.柯林斯"
IRE_kesilin_desc: "迈克尔柯林斯出生于爱尔兰科克郡的一个小村庄，他从小聪明早熟，脾气暴烈，富有爱国热情。1916年，他参加了复活节起义，因此举在爱尔兰备受尊敬，英国内战爆发后，他团结了爱尔兰共和军，运用高超的游击战术与组织能力狠狠打击了留在爱尔兰的英国军队和忠于英王的爱尔兰部队。在打败了留守北爱尔兰的爱尔兰皇家警察卫队后，他向世界宣告了爱尔兰共和国的成立，无数爱尔兰人梦寐以求的独立终于得以实现。\n1923年的选举中，柯林斯被爱尔兰议会选举为第一届爱尔兰总统，英国内战结束后，柯林斯派代表团与英国展开了谈判，最终英国政府承认了爱尔兰的独立与北爱尔兰的自治。\n柯林斯执掌美丽的翡翠之岛已过去了十余年，作为爱尔兰独立运动中不可或缺的人物，他成功巩固了他的地位，爱尔兰人民相信，在大块头的带领下，爱尔兰的未来一定繁荣且美好。"



fallen_shizi: "陨落的雄狮"
fallen_shizi_desc: "自不列颠岛分崩离析以来，我们的殖民地早已四分五裂，被其余国家而蚕食殆尽，维多利亚时代的荣光似乎已经一去不复返，海外的自治领似乎也没有回归帝国的打算。然而我们要做的事情太多太多，收复殖民地的事只能一拖再拖，但终有一日，我们会让那轮太阳在海洋上再次升起，让不列颠的荣光笼罩世界。\n\n\n\n\n\n£GFX_fallen_shizi_desc\n\n\n\n\n\n"
ENG_broken_insdutry: "百废待兴的工业"
ENG_broken_insdutry_desc: "不列颠本土的工业已因为内战毁于一旦，伦敦股市的崩盘更给了我们本就脆弱的工业重重一拳，在废墟之中，不列颠的未来又该何去何从呢？\n\n\n\n\n\n£ENG_broken_insdutry_desc\n\n\n\n\n\n"
ENG_britain_seabase: "不列颠海军传统"
ENG_britain_seabase_desc: "海军一直是我们不列颠的骄傲，皇家海军曾亲手击败无数强敌。即使是在内战期间，皇家海军也一直是王室忠诚的保护者。没有海军，我们便没有一切，不管多穷我们在海军上的的输出绝不能少。\n统治吧，不列颠尼亚！不列颠尼亚统御四海！\n\n\n\n\n\n£GFX_ENG_britain_seabase_desc\n\n\n\n\n\n"


DARK_VIVER: "暗流涌动"
DARK_VIVER_desc: "不可否认的是，大萧条不仅对我国的经济造成了巨大的影响，而且同样对我国的其他邻国造成了影响。我们的邻国——德国，在他们镇压了十一月革命之后，那些失败了的革命者大多逃亡我国，这同样对我国的治安和基层稳定造成了不小的破坏，随着新首相的上任，或许这些赤匪能够永远地安静……\n\n\n\n\n\n£DARK_VIVER_desc\n\n\n\n\n\n"
union_dream: "联合之梦"
union_dream_desc: "从勃艮第王朝到哈布斯堡，从联省共和国到重新拼凑的联合王国，低地人民联合的梦想从未破灭，纵观联合王国建立以来，低地的发展远超历史上任何时期，就像《布鲁塞尔宣言》中引用的一句荷兰老话一样：§R“永不分裂，团结一致到永远！”\n\n\n\n\n\n£union_dream_desc\n\n\n\n\n\n"
kingdom_army: "王国军队"
kingdom_army_desc: "我国的陆军虽然规模庞大，但不可否认的是，军人们的武器装备十分落后，大萧条对我国的军费同样造成了影响，有些国家沦陷后仍然战斗着的老兵甚至在大萧条时期流落街头，连最基本的退伍津贴都没有，我国一位从德国留学归来的军官约翰·范·登·贝尔赫曾这样评价王国陆军的现状：“我国现在陆军的装备水平，普遍达到了1904年德国的水平。”\n作为拥有广阔殖民地的我国来说，海军绝对是我国占优势的军种，在三国联合之后，我国海军的质量迎来了质的飞跃，我国耗费5600万联邦盾打造的“西里伯斯号”航母，也将我国海军带入了世界前列。\n我国空军和陆军相比自然也好不到哪去，我国直到1934年才设立了正式的航空管理局，飞机的数量和两个邻国比自然也不算多，其中以阿姆斯特丹工厂生产的占绝大多数，但质量也不乐观，空军要走的路，远比陆军要远的多……\n\n\n\n\n\n£kingdom_army_desc\n\n\n\n\n\n"
national_allcountry: "民族问题"
national_allcountry_desc: "从1815年建立的王国就能看出，分离主义运动带给我国的伤害远比大萧条或者德国要多的多，弗拉芒民族联盟，雷克斯运动，瓦隆自治联盟……这些政党和团体对我国的政治计划百般阻挠，对我国的稳定也造成了不小的影响，新首相提出的方案似乎能让这群渣滓滚出这个联合的国家……\n\n\n\n\n\n£national_allcountry_desc\n\n\n\n\n\n"
todays_fishmeat: "今日鱼肉"
todays_fishmeat_desc: "不得不承认，王国最开始建立是英国人的施舍，也是法德二国博弈的棋子，她们将我国当做一块肥美的鱼肉，将我国用枪炮切割，细细品尝每块肉蕴含的无限美味，但低地被人摆弄的时代已经过去了，团结起来，而他日，我为刀俎！"
world_war_heat: "大战带来的伤痛"
world_war_heat_desc: "上次大战对我国的影响无疑是深刻的，无论是荷兰、比利时、还是卢森堡，她们的肉体被千刀万剐，但她们的灵魂仍然炽热地活着，千疮百孔的社会不算什么，真正需要解决的是退伍老兵的精神状态和兵源问题……\n\n\n\n\n\n£world_war_heat_desc\n\n\n\n\n\n"
jhon_heser_second_leader: "约翰.舍尔\n\n\n\n\n\n\n£jhon_heser\n\n\n\n\n\n\n\n\n总理\n\n\n\n\n\n\n\n\n"
