    tfe_scf_news.1.t:0"洛杉矶工人运动解散"
    tfe_scf_news.1.d:0"经过长达三年的大审查与潜伏，洛杉矶和旧金山两大城市的赤色斗争运动据点和报刊均被军警查封，不仅查处了多封没来得及销毁的宣传册和横幅，还顺藤摸瓜逮捕了工会主要领导人兼报刊主负责人霍华德·斯科特。\n\n此次行动被洛杉矶政府称作是一场成功的反赤色威胁维和行动。"
