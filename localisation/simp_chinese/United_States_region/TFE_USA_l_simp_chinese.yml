 USA_Incompetent_Army:0 "无能的军队"
 USA_Incompetent_Army_desc:0 "以国防军事为第一要务的全国永久动员政策是联邦共和国政府成立以来的根基和生存之道，我们要想洗去曾经的耻辱、再一次将民主自由传播到整个美利坚的话必须强军强国，但上一任的胡佛总统却在国会上提出增加军备与预算会造成大萧条加剧，导致联邦政府军队贪污腐化严重，倒卖武器装备和抗拒训练等行为已成大部分军队的家常便饭......"
 USA_Incompetent_Army_tip:"\n§R无法解散部队,无法训练新部队§!"
 USA_The_Nation_of_Enterprises:0 "国家由大企业主导"
 USA_The_Nation_of_Enterprises_desc:0 "福特、通用动力、波音、勃朗宁为首的几个军工复合体企业在1900年后逐渐形成了包围整个北方的利益共同体，他们各司其职，负责着国家的军事、经济和能源。但这是以牺牲政府独立性被迫作出的妥协。30年来，各州早已习惯公司员工和高管的霸道垄断，但新的时代、新的机遇，新总统上任后会依旧选择和这些寡头§Y妥协§!，还是用强硬的手段§R宣布主权......§!"
 USA_Ethnic_conflict:0 "民族冲突"
 USA_Ethnic_conflict_desc:0 "我们对外宣称自己是民主的灯塔，是对抗传统殖民主义和不平等的先锋，但南方叛徒的成功给予了我们很大打击，他们以法西斯化政策和民族主义洗脑民众，将我们的合众国彻底的分裂，我们绝不会容忍非法政权继续存在，统一的事业势不可挡。但近年来，南方的不断渗透和他们对西部地区进一步干涉使我们意识到西部地区将是新的“战场”"
 USA_The_Tragedy_of_a_Divided_Homeland:0 "祖国分裂之殇"
 USA_The_Tragedy_of_a_Divided_Homeland_desc:0 "林肯及其传统议会联邦制已然证明了其在美国的失败，一味的仁慈将会使我们再一次陷入到万劫不复，民主党与共和党的政治垄断会持续扼杀政治自由，我们新的联邦共和国是以权威和秩序筑成的民主堡垒，是新世纪实践民主的重要程序"
 USA_Northern_Free_State:0"北方自由州"
 USA_Northern_Free_State_desc:0"我们以民主制为基础，主张政治多元化和种族平等主义，是维护和平的先锋"
 

