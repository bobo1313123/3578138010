 USA_Large_business_owners: "国家由大企业主导"
 USA_Large_business_owners_desc: "福特、通用动力、波音、勃朗宁为首的几个军工复合体企业在1900年后逐渐形成了包围整个北方的利益共同体，他们各司其职，负责着国家的军事、经济和能源。但这是以牺牲政府独立性被迫作出的妥协。30年来，各州早已习惯公司员工和高管的霸道垄断，但新的时代、新的机遇，新总统上任后会依旧选择和这些寡头妥协，还是用强硬的手段§R宣布主权...... §!"
 USA_Incompetent_Army: "无能的军队"
 USA_Incompetent_Army_desc: "以国防军事为第一要务的全国永久动员政策是联邦共和国政府成立以来的根基和生存之道，我们要想洗去曾经的耻辱、再一次将民主自由传播到整个美利坚的话，必须强军强国。但上一任的胡佛总统却在国会上说增加军备与预算会造成大萧条加剧，导致联邦政府军队贪污腐化严重，倒卖武器装备和抗拒训练等行为已成大部分军队的家常便饭......\n\n\n§R无法训练，解散或者编辑陆军师§!"
 USA_Ethnic_conflict: "民族冲突"
 USA_Ethnic_conflict_desc: "我们对外宣称自己是民主的灯塔，是对抗传统殖民主义和不平等的先锋，但南方叛徒的成功给予了我们很大打击，他们以法西斯化政策和民族主义洗脑民众，将我们的合众国彻底的分裂，我们绝不会容忍非法政权继续存在，统一的事业势不可挡。但近年来，南方的不断渗透和他们对西部地区进一步干涉使我们意识到西部地区将是新的“战场”。"
 USA_The_Tragedy_of_a_Divided_Homeland: "祖国分裂之殇"
 USA_The_Tragedy_of_a_Divided_Homeland_desc: "林肯及其传统议会联邦制已然证明了其在美国的失败，一味的仁慈将会使我们再一次陷入到万劫不复，民主党与共和党的政治垄断会持续扼杀政治自由，我们新的联邦共和国是以权威和秩序筑成的民主堡垒，是新世纪实践民主的重要程序。"
 USA_Northern_Free_State: "北方自由州"
 USA_Northern_Free_State_desc: "他们以民主制为基础，主张政治多元化和种族平等主义，是维护和平的先锋力量。"


 TFE_title_loc_USA:"美利坚联邦共和国"
 TFE_desc_loc_USA:"「所谓美国」\n在过去的150年中，美利坚这个名号在世界中早已一蹶不振，美洲大陆日益严重的极右翼民粹主义和社会主义浪潮席卷着这个破败不堪的国家。国土分裂和新英格兰问题没解决，国会依然吵架、官员依然腐败、军队依然无能。废物胡佛给我们留下的烂摊子需要一位铁腕领袖来收拾，联邦的命运必须在平稳中前进，任何过激或不脚踏实地的鲁莽都有可能使我们的仅存的民主陷入万劫不复......"

 
 usa_intro.1.t:"苦涩失败"
 usa_intro.1.d:"1861年3月4日，林肯就任第十六任总统。美国当时有三千二百万人口、六千公里运河、四万公里铁路，工业产值居全球第四。但南北经济与意识形态尖锐对立：南方是种植园经济，北方是工业多元经济。土地与废奴分歧日益激烈。1860年国会通过宅地法，西进获得爱达荷、蒙大拿等地支持；南方则靠种植园利益与奴隶贸易链团结佛罗里达、肯塔基、密西西比、德克萨斯等州。\n\n1861年4月，南卡罗来纳、弗吉尼亚退出联邦，南方邦联成立，杰斐逊任总统，南方军炮击查尔斯顿港，南北战争爆发。英西已与南方签订贸易协定。加利福尼亚征部队攻联邦，虽拉长补给线，却使加州黄金充分开采。9月，北军谢尔曼攻沃思堡，因补给过长、疫情与风沙误判，被南方莫斯比围歼，谢尔曼侥幸逃脱。东线南方用英购火炮步枪压制格兰特，皮克特冲锋以微小代价拿下高地，罗伯特·李骑兵从西、南包围安德森部队。加州民兵与德克萨斯军队会师后，南方完成半岛战役和葛底斯堡包围战。\n\n1864年，罗伯特·李攻入华盛顿特区以南所有地区，1865年，林肯被迫签投降书。美国不再合众为一，一道铁幕在弗吉尼亚降下，南北分裂而治。联邦政府崩溃，林肯遭众议院唾弃，街头示威增加。参议院院长宣布紧急状态，动员骑警、宪兵逮捕激进分子。1866年1月雪夜，格兰特率部闯入白宫，军队接管权力。辉格党痛批军政府独裁。英属加拿大出兵新英格兰，联邦军一路溃败。英国与华盛顿政府签约：赔款、开放经济区、限制军队规模。新总统安德鲁·约翰逊撤销格兰特改革议案，成立联邦共和国政权。"
 usa_intro.1.a:"我想多了解一些这段历史。"
 usa_intro.1.b:"我已经很了解这段历史了。"
 usa_intro.2.t:"红色浪潮"
 usa_intro.2.d:"1885年，联邦共和国总统麦金莱在第二次西进完成后与俄罗斯签订双边贸易谈判，国会通过干涉主义性质的五号总统令，企图派兵赴日本和大清开辟市场、建立殖民地。但在列强谴责挤兑下，只有少部分军队驻守北京美国领事馆。\n\n1911年辛亥革命爆发，联邦共和国军队哗变，司令官声称帮助亚洲民主斗士捍卫正义，三个步兵团并入孙中山革命军。麦金莱称这是对祖国的背叛。南方联盟国见亚洲劳保盟友爆发民主革命，也派骑兵团配合清军镇压。辛亥革命成为第一次南北战争后南北军队首次交火。\n\n1913年一战在欧洲爆发，麦金莱病逝，共和党人胡佛上台，颁布孤立主义政策。1914年初，新英格兰港口冰封，贸易受阻，英国因欧战无法再派治安军。3月，三千工人因工资福利罢工，加拿大警察无力阻止，工人拿起船桨、板凳、小刀甚至抢夺警局枪支，加拿大公司被迫让步。这场运动成为北美左翼思潮第一次尝试，为马克思主义与革命思想传播奠定基础，也促使联邦共和国劳动法和体制外工会诞生。\n\n1921年经济危机再袭北美。南方邦联因与全球金融体系几乎脱钩、自给自足的战时经济而避免冲击；北方则陷入失业潮和通货膨胀，波士顿、底特律、克里夫兰、费城、华盛顿大量银行倒闭，工人街头乞讨。胡佛政策雪上加霜。工人组成有纪律有规模的抵抗组织，高喊福利自由、补全工资，联合联邦警察抢烧外资工厂。同时加拿大废除不平等条约，重新审视对美外交与贸易政策。"
 usa_intro.2.a:"有趣。"
 usa_intro.3.t:"路在何方"
 usa_intro.3.d:"1930年深秋，伦敦股票市场断崖暴跌，连续数月击碎市场信心。银行接连破产，民间储蓄蒸发，半年内千万家庭从富足跌入赤贫，中产阶级变卖家产仍难维生，贫富差距彻底撕裂。高层豪华晚宴与华盛顿官员无底线贪污，引发众议院议长强烈弹劾。\n\n1933年底的费城，罗斯福领导汽车工人运动和工会冲击社会舆论，左翼运动、民族主义者、社会爱国组织、移民保护委员会等自发集会，对抗联邦军警，高喊“胡佛滚下台”“共和党是大骗子”。次日联邦法院调查胡佛，发现其名下财产和离岸公司贪污受贿达2亿美元，判处挪用联邦共和国公有财产罪和严重贪污罪。共和党陷入舆论打击，政治办公室主任兰登努力挽回局势。\n\n1935年大选如期而至，卡尔文·柯立芝再度走上前台。他曾任副总统，哈定1923年病逝后继任，1924年当选，1929年不再连任。1934年共和党全国代表大会重新召唤这位以沉默谨慎闻名的新英格兰人。1934年12月他重新宣誓就职时，国家已处于爆发点：失业率仍在25%以上，中西部农民骚乱此起彼伏。南北分裂、联邦共和国危机与全球风暴交织，美国正走向未知深渊。"
 usa_intro.3.a:"出发，先走起来，再找方向。"
 tfe_usa_news.1.t:"新英格兰州戒严状态结束"
 tfe_usa_news.1.d:"1935年3月，当国民警卫队和联邦警察的增援抵达波士顿港口后的14小时内，大部分非法集会已被费城当局镇压，激进煽动者及其头目已被逮捕入狱。次日凌晨，国会以全票通过了解除戒严令的议案，当地时间五点五十分，柯立芝总统宣布接受国会议案。以民主党为首的政治反对势力在费城发起小规模演讲，抨击柯立芝政府对人民意志的镇压。"
 tfe_usa_news.1.a:"他们肯定不会善罢甘休"
 tfe_usa_news.1_effect:"§G新英格兰地区不再是非军事区§!"
 tfe_usa_news.2.t:"联邦法院判处胡佛贪污"
 tfe_usa_news.2.d:"当地时间14时，联邦前总统罗伯特胡佛涉嫌在总统任职期间发布虚假事实、贪污公款、违反《国家财产安全法》一案进行一审宣判。\n\n根据联邦议员和证人的指控，胡佛于1933年12月14日以总统身份出席某座谈会时，曾表示自己向费城税务署署长拨款了约四百万美元的经费，随后，他又于1934年1月17日在某公开仪式上接受采访时称，自己沒有存在这一拨款。而这笔用于军事生产的经费后在波士顿郊区的小屋子中被找到，最终因挪用公共紧急财产罪和贪污腐败罪被联邦法院判处无期徒刑。胡佛在隔日便被押送至纽约特别监狱并进行二次审查......"
 tfe_usa_news.2.a:"罪有应得"
 tfe_usa_news.2_effect:"§R胡佛被隐藏，直至某日.....§!"

 tfe_usa_news.3.t:"爱达荷州并入联邦政府"
 tfe_usa_news.3.d:"17日最新消息，爱达荷州首府博伊西居民就公投结果进行庆祝。16日，举行全民公投决定自治州的未来地位，选票上印有两个问题：“您是否赞成并入联邦并获得联邦主体权利？”以及“您是否赞成恢复1865年新联邦宪法并维持从属于独立的地位？”\n\n据初步统计结果显示，已有超过95%的公民赞成爱达荷州加入联邦。庆祝这一结果，当地居民举行了大规模庆祝活动，庆祝首先在该市主要广场进行数小时，之后居民在街道游行，来往行驶的汽车也插上前联邦国旗。当地居民高呼：“我们将重获自由!”"
 tfe_usa_news.3.a:"联邦更加完整"