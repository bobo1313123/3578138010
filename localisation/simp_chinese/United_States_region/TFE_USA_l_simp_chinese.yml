 TFE_desc_loc_USA:0 "§3「所谓美国」§!\n在过去的150年中，美利坚这个名号在世界中早已一蹶不振，七十年前的分裂的问题没解决，1930年的经济危机没解决，新英格兰地区问题没解决，国会依然在吵架、官员依然腐败、军队依然无能，日益严重的极右翼民粹主义和社会主义浪潮席卷着这个破败不堪的国家。胡佛给我们留下的烂摊子需要一位铁腕领袖来收拾，而联邦的命运必须在平稳中前进，任何过激或不脚踏实地的鲁莽都有可能使我们的仅存的民主陷入万劫不复......"
 
