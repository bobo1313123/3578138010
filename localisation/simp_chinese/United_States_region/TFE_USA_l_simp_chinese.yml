 #介绍事件
 usa.history.1.t:"内战之前"
 usa.history.1.d:"1861年3月4日，五十二岁的亚伯拉罕·林肯在白宫宣誓就职，成为了美利坚合众国的第十六任总统，他所接手的是一个正高速崛起的国家，有了三千二百万人口、六千公里的运河和四万公里的铁路，充足的自然资源、海量的外国移民、高效的机械化生产和较为安全的地理环境，这使得资本主义得到迅速发展，到十九世纪六十年代，美国的工业产值位于全球第四。\n\n但随之而来的是来自内部的分裂，早在数十年前，南北双方截然不同的经济模式与意识形态文化让国会因此吵个不停。水热充足、土壤肥沃且地势平坦的南方地区成为种植园经济的天然温床；而人口多、交通便利、科技水平高的北方则是工业多元经济的发展重点，土地问题与废奴改革分歧日益激烈。\n\n到1860年，国会通过了宅地法，已获取了包括爱达荷、蒙大拿等地区的支持。而南方通过种植园经济的利益共同体与奴隶贸易链等团结了包括佛罗里达、肯塔基、密西西比和德克萨斯等南方州，双方剑拔弩张。"
 usa.history.1.a:"我想多了解一下。"
 usa.history.1.b:"我已经很了解这段历史了。"
 usa.history.2.t:"苦涩失败"
 usa.history.2.d:"真正的战争从1861年4月开始，南卡罗来纳州、弗吉尼亚州宣布退出联邦，随后脱离联邦的州（佐治亚、田纳西、亚拉巴马、路易斯安那、阿肯色、俄克拉荷马、堪萨斯、加利福尼亚、德克萨斯、新墨西哥）宣布成立新的政权----南方邦联，杰斐逊为新总统，美墨战争老兵与西班牙雇佣军组成的南方军在4月16日向查尔斯顿港的堡垒开炮，南北战争爆发。战前，英国与西班牙政府已和南方地区签订了贸易协定，使得战争时期的南方没有陷入严重的经济危机。加利福尼亚州征集部队在西部进攻联邦军队，虽然拉长了补给线，但使加州地区矿井中的黄金得到了充分的开采。\n\n1861年9月13日，北军将领谢尔曼率部队试图攻占沃思堡地区，但因补给线过长、军队疫情问题与风沙原因误判局势，使主力部队被南方将领莫斯比的部队围歼，谢尔曼侥幸逃脱。在东部战线上，南方从英国购买的火炮和步枪有效地压制格兰特的军队，皮克特将军发起的大冲锋以微小的代价成功拿下了高地让，罗伯特李的骑兵主力可以从西面和南面包围安德森的纽约步兵团和华盛顿炮兵......这一战役被后人称为近代史上最默契的一场反攻。\n\n加利福尼亚民兵与德克萨斯军队会师后，南方随即以压倒性优势完成了半岛战役和葛底斯堡包围战，1864年，南方民兵在罗伯特李的指挥下已攻入华盛顿特区以南所有地区，林肯被逼在投降书上签字，这场谈判不仅预示着北方主战派的失败，更代表着美利坚合众国不再合众为一，而是随着一道铁幕在弗吉尼亚的降下宣布了分裂而治。"
 usa.history.2.a:"有趣。"
 usa.history.3.t:"合众不再"
 usa.history.3.d:"战后，南方成立了美利坚联盟国。而北方的美利坚合众国政府在投降后崩溃，林肯遭到全众议院唾弃，街头游行示威活动增加，参议院院长宣布国家进入紧急状态，动员骑警部队和宪兵逮捕激进主义分子，1866年1月的雪夜，格兰特将军带领部队闯入白宫，随后军队紧急接管国家权力，辉格党代表人强力批判军政府的独裁行为，声称这是对宪法修正案的背叛；与此同时，英属加拿大出兵新英格兰，1812年战争的场景再一次上演，早已失去士气的联邦军队在英国军队的进攻下一路溃败，英国与华盛顿政府签署条约，包括赔款、在新英格兰地区开放经济区和限制军队规模等。新总统安德鲁约翰逊撤销前格兰特所发布的军政府改革议案，以加强国家统帅力和集中力量为由，宣布成立美利坚联邦共和国。\n\n1885年，美利坚联邦共和国总统麦金莱在第二次西进运动完成后与俄罗斯签订了双边贸易谈判，并国会上通过了具有干涉主义性质的五号总统令，企图派兵赴日本和大清开辟市场，建立殖民地，但在众列强的谴责与挤兑中，联邦军队并未得到满足，转而在菲律宾巩固了政权，只有少部分军队驻守北京的美国领事馆。随后，美利坚联盟国以保卫亚洲和平为由，与清政府方面交好，并向其出口枪械和先进农具。\n\n1911年，辛亥革命爆发，司令官声称帮助亚洲民主斗士捍卫正义，将三个步兵团并入孙中山的革命军中。美利坚联盟国看着亚洲劳保盟友爆发民主革命，也派出了骑兵团配合清军进行镇压。辛亥革命也成为了第一次南北战争后南北军队的第一次交火对抗。"
 usa.history.3.a:"我的天啊！"
 usa.history.4.t:"红色浪潮"
 usa.history.4.d:"1913年第一次世界大战在欧洲爆发，麦金莱因病去世，随后新的共和党人赫伯特胡佛总统上台，颁布了一系列孤立主义政策，但这些政策的局限性在几年后的经济大危机中被验证。1914年年初新英格兰港口遭大规模冰封，贸易活动受阻，工业原料和产品进出口贸易被迫停止，英国因欧洲战争原因无法再向新英格兰派遣治安军。直到3月，港口数千名工人因工资，工时等问题集体罢工，当地加拿大警察部队无力阻止，部分工人拿起船桨、板凳、小刀等物品发起暴动，甚至开始抢夺警察枪支，加拿大公司社员与投资商被迫让步。这场浩浩荡荡的运动成为北美左翼思潮的第一次尝试，马克思主义与革命思想逐渐传播于大众中。\n\n华盛顿政府官员在运动后的一年中多次会面来自欧洲的左翼运动政治家和作者，多重因素的影响促使了美利坚联邦共和国劳动法和体制外工会的诞生。 直到1921年经济危机再次袭扰北美大陆，南方邦联因与全球化金融体系几乎脱钩和自给自足的战时经济避免了冲击；而北方就没这么好运了，波士顿、底特律、克里夫兰、费城和华盛顿等特大城市陷入失业潮和通货膨胀，大量银行倒闭，底层工作者被迫走上街头乞讨，无数的企业雇员被解雇。\n\n就在这样的社会环境下，胡佛总统的放任政策却让这本就恶劣的金融市场雪上加霜。这次，工人组成了有纪律有规模的抵抗组织，在各地高喊福利自由和补全工资的口号，工人们愈发激进，加之联邦警察也深受政策之苦，他们中的一部分联合工人一起对外资企业和外资工厂进行打砸。这次运动让隔壁的加拿大政府意识到了左翼运动的强大与可怕，他们为了不让国内也陷入到革命的恐怖下，便出台了一系列妥协性的福利政策，也废除了与美条约，重新审视外交态度和对美贸易政策。"
 usa.history.4.a:"原来如此。"
 usa.history.5.t:"路在何方"
 usa.history.5.d:"1930年深秋，风暴骤然降临。伦敦股票市场迎来了断崖式暴跌，千万家庭一夜之间从富足跌入赤贫。短短半年时间，从伦敦证券交易所崩溃带来的余波便使全美金融体系彻底瘫痪，信用体系完全瓦解，金钱失去流通价值，社会经济运转近乎停滞。联邦共和国乡村的农场因产能过剩、物流瘫痪，农产品价格跌至负数，大量牧场破产，只能将粮食、牲畜废弃损毁，随之而来的是南方的农业冲击和经济威胁。\n\n城市之中，千万民众深陷饥荒，粮荒、物资匮乏成为常态。物价彻底失控，刚需物资千金难求，曾经富足的中产阶级变卖所有家产，依旧难以维持生计，贫富差距在短短两年间数倍扩大。高层各种豪华晚宴和华盛顿官员的无底线贪污最终引发了国会众议院议长的强烈弹劾。\n\n1933年底的费城，罗斯福领导的汽车工人运动和工会组织不停冲击着社会舆论，左翼运动、民族主义者、社会爱国组织、移民保护委员会等组织自发组成集会对抗联邦军警，高喊着胡佛滚下台、共和党是大骗子等口号。不日，联邦法院开始了对胡佛的调查，发现其名下财产和私人离岸公司贪污受贿钱财高达20亿美元，法院判处胡佛擅自挪用联邦共和国公有财产罪和严重贪污罪。 而此时的共和党也处于舆论打击中，共和党政治办公室主任兰登在白宫采访面前努力挽回局势。\n\n很快，1935年大选如期而至，当卡尔文·柯立芝再度走上前台。这位前副总统——在哈定总统1923年病逝后继任、又在1924年当选连任的前总统——在1929年选择不再寻求连任时，曾被普遍认为是急流勇退。然而命运的安排令人难以预料：在1934年的共和党全国代表大会上，陷入迷茫的党代表们重新召唤了这位以沉默和谨慎闻名的新英格兰人。柯立芝于1934年12月重新宣誓就职时，整个国家已经处于爆发点，失业率在百分之二十五以上，农民骚乱在中西部此起彼伏。望着这样的局面，柯立芝十分明白自己的处境，他要么成为联邦最伟大的一位总统，"
 usa.history.5.a:"要么成为联邦§R最后一位总统§!......"