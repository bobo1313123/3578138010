#特质名称
George_V_traits:0"水手国王"
George_V_traits_desc:0"乔治五世出生于1865年，是英国国王爱德华七世的次子，和他的兄弟作为海军学员，在战舰上接受航海教育和军事教育。其兄因肺炎意外逝世后，他被当做继承人培养并获得了威尔士亲王的王位，当其父于1910年驾崩后，他开始执掌这个帝国。\n1914年，当巴尔干的紧张局势引爆了世界大战时，乔治五世联合英国的法国以及俄国盟友向自己的表兄威廉二世宣战，为表达反德主张他改掉了自己的德国姓氏，在战争中，乔治五世全力以赴的支持战争，他亲自视察陆军和海军部队，参观工厂与医院。当1919年战争结束的消息传来时，伦敦成为了群众狂欢的海洋，然而英国政府宣布支持俄国内战中的白军一方这一决定彻底点燃了火药桶，愤怒的士兵联合不愿再加入战争的工人宣布起义，英国内战爆发，英国的殖民帝国也四分五裂。\n尽管伦敦在保皇派的帮助下没有受到战火侵袭，但君主制的合法制仍然受到了怀疑。内战结束后，新成立的不列颠委员会为了消除抗议和提升合法栍，将乔治五世请来成为立宪君主，国王陛下再一次回到了英国的政治生活中，然而，内战的阴霾还没有散去，反对君主制的人仍在窃窃私语，对现在的王国政府嗤之以鼻的势力也大有人在，不列颠的未来究竟在何方仍是未知数。"
