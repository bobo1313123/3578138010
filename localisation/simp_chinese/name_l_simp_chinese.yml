liberal_radicalism:0 "自由激进主义"
liberal_radicalism_desc:0 "\n\n\n\n£GFX_ARG_liberal_radicalism_Pictures\n\n\n\n\n\n§!贫民之父伊利戈延已经去世，但是他的主义已经流传下去，在20世纪目前过去的年月，激进公民联盟始终在坚持这一理论与理想。自由激进主义的重要两点即为自由与民族，在限度之内，建立民主选票制与贸易保护，同时，保障无产阶级的权利。\n于欧洲的伙伴大径相庭的是，这一主义仍保留着一丝民粹的思想，利用反寡头、个人化的领导以及关于社会承诺，他建立起在20年代绝对稳固的统治。"
